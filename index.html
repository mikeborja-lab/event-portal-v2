<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Portal v2</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --t-base-bg: #fcfcfc; --t-surface: rgba(255, 255, 255, 0.92); --t-text-main: #111827; --t-text-muted: #6b7280;
      --t-primary: #e11d48; --t-grad: linear-gradient(135deg, #f43f5e, #be123c);
      --t-shadow: rgba(225, 29, 72, 0.15); --t-border: rgba(255, 255, 255, 0.6);
      --t-mesh-1: rgba(244, 63, 94, 0.15); --t-mesh-2: rgba(225, 29, 72, 0.12); --t-mesh-3: rgba(253, 164, 175, 0.18);
    }
    body { background-color: var(--t-base-bg); color: var(--t-text-main); font-family: 'Inter', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .nav-btn label, .theme-table-header th, .uppercase-tracking { font-family: 'Montserrat', sans-serif; }
    .score-number, .rolling-number { font-family: 'Roboto Mono', monospace; }

    .mesh-bg { position: fixed; inset: -20%; z-index: -1; background-color: var(--t-base-bg); background-image: radial-gradient(circle at 15% 30%, var(--t-mesh-1), transparent 50%), radial-gradient(circle at 85% 20%, var(--t-mesh-2), transparent 50%), radial-gradient(circle at 50% 80%, var(--t-mesh-3), transparent 60%); background-size: 100% 100%; filter: blur(80px); animation: aurora-breathe 20s ease-in-out infinite alternate; pointer-events: none; }
    @keyframes aurora-breathe { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 50% { transform: translate(3%, 4%) scale(1.05) rotate(2deg); } 100% { transform: translate(-3%, -2%) scale(0.95) rotate(-2deg); } }

    .card-panel, .theme-surface { background-color: var(--t-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .card-panel { border: 1px solid var(--t-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.05); border-radius: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .theme-text { color: var(--t-primary); } .theme-text-muted { color: var(--t-text-muted); } .theme-bg-soft { background-color: var(--t-base-bg); }
    .theme-btn { background: var(--t-grad); color: #ffffff; box-shadow: 0 4px 15px var(--t-shadow); border: none; }
    .theme-btn:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 8px 25px var(--t-shadow); }
    .glass-panel { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); }

    .theme-table-header { background-color: rgba(128, 128, 128, 0.06); border-bottom: 1px solid rgba(128, 128, 128, 0.15); }
    .theme-table-row { border-bottom: 1px solid rgba(128, 128, 128, 0.08); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease; }
    #table-averages, #table-peoples-choice { display: table; width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; }

    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 32px; width: 32px; border-radius: 50%; background: var(--t-surface); cursor: pointer; margin-top: -12px; box-shadow: 0 4px 15px var(--t-shadow); border: 4px solid var(--t-primary); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track { height: 8px; cursor: pointer; border-radius: 4px; border: 1px solid var(--t-border); background: linear-gradient(to right, var(--t-primary) 0%, var(--t-primary) var(--fill, 50%), var(--t-base-bg) var(--fill, 50%), var(--t-base-bg) 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
    
    @keyframes score-pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--t-primary); } 100% { transform: scale(1); } }
    .score-pop { animation: score-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; }
    @keyframes view-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .view-animate { animation: view-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger-card { opacity: 0; transform: translateY(28px); transition: opacity 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .stagger-card.visible { opacity: 1; transform: translateY(0); }
    @keyframes slide-in-right { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-right { animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    @keyframes lock-burst { 0% { transform: scale(1); } 40% { transform: scale(1.03); box-shadow: 0 0 0 6px var(--t-shadow); } 100% { transform: scale(1); box-shadow: none; } }
    .score-locked-flash { animation: lock-burst 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    .premium-svg-particle { position: absolute; animation-timing-function: linear; animation-iteration-count: infinite; will-change: transform; fill: var(--t-primary); filter: drop-shadow(0 10px 15px var(--t-shadow)); }
    @keyframes premium-fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.15; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

    .header-3d-container { perspective: 1000px; transform-style: preserve-3d; }
    .header-3d-content { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
    .header-3d-pop { transform: translateZ(50px); }

    .carousel-container { perspective: 1200px; transform-style: preserve-3d; display: flex; justify-content: center; align-items: center; height: 34rem; position: relative; width: 100%; overflow: hidden; touch-action: pan-y; }
    .carousel-item { position: absolute; width: 75%; max-width: 340px; height: 30rem; border-radius: 2rem; overflow: hidden; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s, z-index 0.6s; cursor: pointer; box-shadow: 0 15px 35px var(--t-shadow); }
    .item-active { transform: translateX(0) scale(1) translateZ(60px); z-index: 30; opacity: 1; pointer-events: auto; cursor: default; }
    .item-prev { transform: translateX(-65%) scale(0.8) translateZ(-100px) rotateY(25deg); z-index: 20; opacity: 0.5; }
    .item-next { transform: translateX(65%) scale(0.8) translateZ(-100px) rotateY(-25deg); z-index: 20; opacity: 0.5; }
    .item-hidden { opacity: 0; pointer-events: none; transform: scale(0.6) translateZ(-300px); z-index: 10; }
  </style>
</head>
<body class="min-h-screen pb-24">

<div class="mesh-bg"></div>
  <div id="premium-particles" class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden"></div>

  <div id="loader" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
      <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center">
          <svg class="animate-spin h-10 w-10 text-emerald-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span id="loader-text" class="text-sm font-black text-slate-800 tracking-widest uppercase-tracking">Connecting...</span>
      </div>
  </div>

  <div id="app-container" class="p-4 md:p-8">
    <div class="header-3d-container mb-8 text-center mt-4">
      <div class="header-3d-content inline-block">
        <h1 class="text-4xl md:text-5xl font-black header-3d-pop drop-shadow-lg leading-normal py-2" id="display-title">System Connecting...</h1>
        <p id="display-subtitle" class="text-lg opacity-80 header-3d-pop mt-2 font-medium">Core Operations</p>
        <p id="display-location" class="text-sm theme-text font-bold header-3d-pop mt-1">Location Undefined</p>
      </div>
    </div>
    <p id="status-text" class="text-center text-slate-400 mb-8 font-bold">Initializing database...</p>

    <div id="view-home" class="hidden">
      <div id="carousel-track" class="carousel-container mb-8"></div>
      <div id="vote-prompt-section" class="hidden text-center mb-4">
        <div id="vote-countdown" class="mb-4">
          <span class="text-xs uppercase-tracking theme-text-muted font-bold">Voting Closes In</span>
          <h3 id="countdown-timer" class="text-2xl font-black score-number theme-text mt-1">--:--:--</h3>
        </div>
        <p id="vote-closed-msg" class="hidden text-red-500 font-bold uppercase-tracking text-sm mb-4">Voting is Closed</p>
      </div>
      <div id="voting-gallery" class="max-w-md mx-auto"></div>
    </div>
    
    <div id="view-login" class="hidden max-w-sm mx-auto card-panel p-8">
      <h2 class="text-2xl font-black mb-6 text-center">Secure Access</h2>
      <input type="text" id="login-username" placeholder="Username" class="w-full p-3 rounded-xl mb-4 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-400" onkeydown="if(event.key === 'Enter') document.getElementById('login-password').focus();">
      <div class="relative w-full mb-6">
        <input type="password" id="login-password" placeholder="Passkey" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-rose-400 pr-12 text-black" onkeydown="if(event.key === 'Enter') window.processLogin();">
        <button type="button" onclick="const p=document.getElementById('login-password'); const i=document.getElementById('eye-icon'); if(p.type==='password'){p.type='text'; i.className='fas fa-eye-slash';}else{p.type='password'; i.className='fas fa-eye';}" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-800 transition-colors">
          <i id="eye-icon" class="fas fa-eye text-lg"></i>
        </button>
      </div>
      <p id="login-error" class="text-red-500 text-sm font-bold mb-4 hidden text-center"></p>
      <button id="login-btn" onclick="window.processLogin()" class="theme-btn w-full py-3 rounded-xl font-black uppercase-tracking text-sm">Authenticate</button>
    </div>

    <div id="view-judging" class="hidden max-w-md mx-auto">
      <div id="segment-tabs" class="flex overflow-x-auto mb-6 p-2 bg-black/5 rounded-2xl gap-2 hide-scroll-bar"></div>
      <div id="candidates-container"></div>
    </div>

    <div id="view-scores" class="hidden max-w-5xl mx-auto">
      <div id="peoples-choice-card" class="card-panel p-6 mb-8 hidden">
        <h3 class="text-xl font-black mb-4 theme-text uppercase-tracking border-b border-black/10 pb-2">People's Choice</h3>
        <div class="overflow-x-auto"><table class="w-full" id="table-peoples-choice"></table></div>
      </div>
      <div class="card-panel p-6 mb-8">
        <h3 class="text-xl font-black mb-4 theme-text uppercase-tracking border-b border-black/10 pb-2">Aggregated Matrix</h3>
        <div class="overflow-x-auto"><table class="w-full" id="table-averages"></table></div>
      </div>
    </div>

    <div id="view-admin" class="hidden max-w-4xl mx-auto space-y-6 pb-20">
       <div class="card-panel p-6">
         <h2 class="text-2xl font-black mb-6 border-b pb-2">Event Architecture</h2>
         <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
           <div><label class="text-xs font-bold uppercase-tracking text-gray-500">Event Title</label><input type="text" id="admin-setting-title" class="w-full p-2 border rounded-lg mt-1"></div>
           <div><label class="text-xs font-bold uppercase-tracking text-gray-500">Sub Title</label><input type="text" id="admin-setting-subtitle" class="w-full p-2 border rounded-lg mt-1"></div>
           <div><label class="text-xs font-bold uppercase-tracking text-gray-500">Location</label><input type="text" id="admin-setting-location" class="w-full p-2 border rounded-lg mt-1"></div>
           <div><label class="text-xs font-bold uppercase-tracking text-gray-500">Theme Color</label>
              <select id="admin-setting-theme" class="w-full p-2 border rounded-lg mt-1">
                <option value="red">Velvet (Red)</option><option value="blue">Sapphire (Blue)</option>
              </select>
           </div>
         </div>
         <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 p-4 bg-black/5 rounded-xl border border-black/10">
            <div class="flex items-center justify-between">
              <label class="font-bold uppercase-tracking">Enable Public Voting</label>
              <input type="checkbox" id="admin-setting-voting" class="w-6 h-6 rounded cursor-pointer">
            </div>
            <div>
              <label class="text-xs font-bold uppercase-tracking text-gray-500">Voting Deadline (Optional)</label>
              <input type="datetime-local" id="admin-setting-deadline" class="w-full p-2 border rounded-lg mt-1">
            </div>
         </div>
         <button onclick="window.saveSettings()" class="theme-btn px-6 py-3 rounded-lg font-bold w-full">Deploy Configuration</button>
       </div>
       <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
         <div class="card-panel p-5">
            <h3 class="font-black uppercase-tracking border-b pb-2 mb-4">Candidates</h3>
            <div id="admin-candidates-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto text-sm"></div>
            <input type="text" id="new-cand-id" placeholder="ID (e.g. 1)" class="w-full p-2 border rounded mt-2 text-sm">
            <input type="text" id="new-cand-name" placeholder="Full Name" class="w-full p-2 border rounded mt-2 text-sm">
            <button onclick="window.addCandidate()" class="w-full bg-slate-800 text-white rounded p-2 mt-2 text-xs font-bold hover:bg-slate-700">Add Candidate</button>
         </div>
         <div class="card-panel p-5">
            <h3 class="font-black uppercase-tracking border-b pb-2 mb-4">Criteria</h3>
            <div id="admin-criteria-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto text-sm"></div>
            <input type="text" id="new-crit-id" placeholder="ID (e.g. gown)" class="w-full p-2 border rounded mt-2 text-sm">
            <input type="text" id="new-crit-label" placeholder="Full Label" class="w-full p-2 border rounded mt-2 text-sm">
            <input type="number" id="new-crit-max" placeholder="Max Score (e.g. 10)" class="w-full p-2 border rounded mt-2 text-sm">
            <button onclick="window.addCriteria()" class="w-full bg-slate-800 text-white rounded p-2 mt-2 text-xs font-bold hover:bg-slate-700">Add Criteria</button>
         </div>
         <div class="card-panel p-5">
            <h3 class="font-black uppercase-tracking border-b pb-2 mb-4">System Users</h3>
            <div id="admin-users-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto text-sm"></div>
            <input type="text" id="new-user-username" placeholder="Username" class="w-full p-2 border rounded mt-2 text-sm">
            <input type="text" id="new-user-pass" placeholder="Password" class="w-full p-2 border rounded mt-2 text-sm">
            <select id="new-user-role" class="w-full p-2 border rounded mt-2 text-sm">
              <option value="Judge">Judge</option><option value="Tabulator">Tabulator</option><option value="Admin">Admin</option>
            </select>
            <button onclick="window.addUser()" class="w-full bg-slate-800 text-white rounded p-2 mt-2 text-xs font-bold hover:bg-slate-700">Add User</button>
         </div>
       </div>
    </div>
  </div>

  <nav class="fixed bottom-0 inset-x-0 theme-surface border-t border-black/10 shadow-2xl z-[100] pb-safe hide-on-print">
    <div class="flex justify-around items-center h-16 max-w-md mx-auto px-4" id="main-nav">
      <button onclick="window.switchView('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all theme-text opacity-100 theme-bg-soft -translate-y-2 shadow-md"><i class="fas fa-home text-lg mb-1"></i><span class="text-[9px] font-black uppercase-tracking tracking-wider">Home</span></button>
      <button onclick="window.switchView('judging')" id="nav-judging" class="nav-btn flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all theme-text-muted opacity-60 hidden"><i class="fas fa-gavel text-lg mb-1"></i><span class="text-[9px] font-black uppercase-tracking tracking-wider">Judge</span></button>
      <button onclick="window.switchView('scores')" id="nav-scores" class="nav-btn flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all theme-text-muted opacity-60 hidden"><i class="fas fa-chart-bar text-lg mb-1"></i><span class="text-[9px] font-black uppercase-tracking tracking-wider">Data</span></button>
      <button onclick="window.switchView('admin')" id="nav-admin" class="nav-btn flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all theme-text-muted opacity-60 hidden"><i class="fas fa-cog text-lg mb-1"></i><span class="text-[9px] font-black uppercase-tracking tracking-wider">Admin</span></button>
      <button onclick="window.switchView('login')" id="nav-login" class="nav-btn flex flex-col items-center justify-center w-14 h-12 rounded-xl transition-all theme-text-muted opacity-60"><i class="fas fa-user-shield text-lg mb-1"></i><span class="text-[9px] font-black uppercase-tracking tracking-wider">Login</span></button>
    </div>
  </nav>

  <div id="offline-toast" style="position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#f9fafb;padding:.6rem 1.4rem;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:all .4s ease;pointer-events:none;z-index:9999;white-space:nowrap">⚡ Offline — score queued locally</div>
  <div id="custom-modal" class="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
    <div id="custom-modal-content" class="theme-surface p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
      <div class="text-center mb-6"><h3 id="modal-title" class="text-2xl font-black text-gray-800"></h3></div>
      <p id="modal-message" class="text-center text-gray-600 mb-8 font-medium leading-relaxed"></p>
      <div id="modal-actions" class="flex justify-center gap-3"></div>
    </div>
  </div>

  <script type="module">
    window.onerror = function(msg, url, line) { alert("System Error: " + msg + "\nLine: " + line); };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVTCaxujL7Q0UmBqr-d5ev3CAZB5t3oxQ", authDomain: "dynamic-event-system.firebaseapp.com",
      projectId: "dynamic-event-system", storageBucket: "dynamic-event-system.firebasestorage.app",
      messagingSenderId: "588923118511", appId: "1:588923118511:web:1dba0b6be0c253d8bec55a"
    };

    const app = initializeApp(firebaseConfig); const db = getFirestore(app); window.db = db;

    window.settings = {}; window.criteria = []; window.candidates = []; window.users = []; 
    window.scoresData = {}; window.lockedScores = {}; window.currentSegment = ''; 
    window.activeUser = { name: "", role: "" }; window.currentCarouselIndex = 0; window.carouselInterval = null;
    window.activeListeners = []; window.latestScores = []; window.latestVotes = {}; window.votingTimerInterval = null;
    let offlineQueue = JSON.parse(localStorage.getItem('pageant_offline_queue')) || [];

    window.alert = function(msg) { window.showModal("System Notice", msg, "alert"); };
    window.sha256 = async function(msg) { const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)); return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join(''); };
    window.showOfflineToast = function() { const t = document.getElementById('offline-toast'); if(!t) return; t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 3500); };
    window.animateParticle = function(el) { let baseX = parseFloat(el.style.left); let amp = Math.random() * 2.5 + 0.8; let freq = Math.random() * 0.015 + 0.007; let t = Math.random() * 100; (function tick() { t += 0.45; el.style.left = (baseX + Math.sin(t * freq) * amp) + 'vw'; requestAnimationFrame(tick); })(); };
    window.animateRowSwap = function(containerId) { const container = document.getElementById(containerId); if (!container) return null; const positions = new Map(); container.querySelectorAll('.theme-table-row').forEach(row => positions.set(row.dataset.id, row.getBoundingClientRect().top)); return { play: () => { container.querySelectorAll('.theme-table-row').forEach(row => { const firstTop = positions.get(row.dataset.id); const lastTop = row.getBoundingClientRect().top; if (firstTop && firstTop !== lastTop) { const deltaY = firstTop - lastTop; row.style.transition = 'none'; row.style.transform = `translateY(${deltaY}px)`; requestAnimationFrame(() => { row.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease'; row.style.transform = ''; }); } }); } }; };
    window.animateCount = function(el, target, decimals = 2, duration = 700) { const start = parseFloat(el.dataset.current || 0); const diff = target - start; if (Math.abs(diff) < 0.01) { el.innerText = target.toFixed(decimals); el.dataset.current = target; return; } let startTime = null; (function step(ts) { if (!startTime) startTime = ts; const progress = Math.min((ts - startTime) / duration, 1); el.innerText = (start + diff * (1 - Math.pow(1 - progress, 3))).toFixed(decimals); if (progress < 1) requestAnimationFrame(step); else { el.innerText = target.toFixed(decimals); el.dataset.current = target; } })(performance.now()); };

) + '%');" class="w-full relative z-10" ${isLocked ? 'disabled' : ''}></div><button onclick="window.submitScore('${c.id}')" id="btn-${c.id}" class="w-full py-4 rounded-xl font-black transition-all uppercase-tracking text-xs shadow-md ${btnClass}" ${isLocked ? 'disabled' : ''}>${isLocked ? 'Score Locked' : 'Submit Evaluation'}</button></div></div>`;

    window.onload = async function() {

    window.processLogin = async function() {

      if (!user || !pass) { err.innerText = "Credentials required."; err.classList.remove('hidden'); return; }
      btn.innerText = "Authenticating..."; btn.disabled = true; err.classList.add('hidden');
      const hashedPass = await window.sha256(pass); 
      try {
        const q = query(collection(db, "Users"), where("username", "==", user)); const querySnapshot = await getDocs(q); if (querySnapshot.empty) throw new Error("Invalid username.");

    window.syncJudgeScores = async function() {
      if (!window.activeUser.name || (window.activeUser.role !== 'Judge' && window.activeUser.role !== 'Admin')) return;

        const q = query(collection(db, "Scores"), where("judge", "==", window.activeUser.name)); const querySnapshot = await getDocs(q);

    window.submitScore = async function(candidateId) {

      const payload = { judge: window.activeUser.name, candidate: c.name, [window.currentSegment]: score, timestamp: Date.now() };
      if (!navigator.onLine) { offlineQueue.push(payload); localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue)); finalizeSubmitUI(); window.showOfflineToast(); return; }
      try { await setDoc(doc(db, "Scores", `${window.activeUser.name}_${c.name}`), payload, { merge: true }); finalizeSubmitUI(); } catch (error) { offlineQueue.push(payload); localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue)); finalizeSubmitUI(); window.showOfflineToast(); }
      function finalizeSubmitUI() { if (navigator.vibrate) navigator.vibrate([15, 20, 60]); window.lockedScores[candidateId] = window.lockedScores[candidateId] || {}; window.lockedScores[candidateId][window.currentSegment] = true; cardPanel.classList.add('score-locked-flash'); setTimeout(() => window.renderCandidates(), 500); }

    window.fetchScoresData = async function() { 
      document.getElementById('loader-text').innerText = "Initializing Live Matrix..."; document.getElementById('loader').classList.remove('hidden'); 
      window.activeListeners.forEach(unsub => unsub()); window.activeListeners = [];
      try {
        const unsubScores = onSnapshot(collection(db, "Scores"), (snapshot) => { window.latestScores = snapshot.docs.map(d => d.data()); window.processAndRenderScores(window.latestScores, window.latestVotes); document.getElementById('loader').classList.add('hidden'); }); window.activeListeners.push(unsubScores);
        const fetchVotes = async () => { const votesSnap = await getDocs(collection(db, "PublicVotes")); window.latestVotes = {}; votesSnap.forEach(doc => { const cName = doc.data().candidateName; window.latestVotes[cName] = (window.latestVotes[cName] || 0) + 1; }); window.processAndRenderScores(window.latestScores, window.latestVotes); };
        await fetchVotes(); const voteInterval = setInterval(fetchVotes, 60000); window.activeListeners.push(() => clearInterval(voteInterval));
      } catch (error) { document.getElementById('loader').classList.add('hidden'); alert("Matrix Error: " + error.message); }
    };

    window.processAndRenderScores = function(rawScores, rawVotes) {
      const avgFlipper = window.animateRowSwap('table-averages');
      const normalizedScores = (rawScores || []).map(s => { let normalized = {}; for (let key in s) { normalized[key.toLowerCase().replace(/\s+/g, '')] = s[key]; } normalized.judge = (s.judge || "").toString().trim(); normalized.candidate = (s.candidate || "").toString().trim(); return normalized; });
      let aggregated = window.candidates.map(c => { let cleanCandidateName = c.name.toString().trim().toLowerCase(); let sc = normalizedScores.filter(s => s.candidate.toLowerCase() === cleanCandidateName); let count = sc.length; let candData = { name: c.name, count: count, total: 0 }; window.criteria.forEach(crit => { let safeCritId = crit.id.toString().toLowerCase().replace(/\s+/g, ''); let avg = count ? sc.reduce((sum, s) => sum + (parseFloat(s[safeCritId]) || parseFloat(s[crit.id]) || 0), 0) / count : 0; candData[crit.id] = avg; candData.total += avg; }); return candData; });
      aggregated.sort((a, b) => b.total - a.total); 

      let maxScores = {}; window.criteria.forEach(crit => { maxScores[crit.id] = Math.max(...aggregated.map(c => c[crit.id] || 0)); });
      const avgTable = document.getElementById('table-averages'); 
      if (avgTable) {
        if (avgTable.innerHTML.trim() === "") {
          let avgHTML = `<tr class="theme-table-header text-[10px] uppercase-tracking tracking-widest"><th class="p-5 font-black text-center w-24 theme-text-muted">Rank</th><th class="p-5 font-black theme-text-muted text-left">Identity</th>`;
          window.criteria.forEach(crit => { avgHTML += `<th class="p-5 font-black theme-text-muted text-center">${crit.short}</th>`; }); avgHTML += `<th class="p-5 font-black theme-text text-right">Aggregated</th></tr>`;
          aggregated.forEach((c, index) => {
            let rankBadge = `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-black/5 theme-text-muted font-bold text-xs mx-auto">${index + 1}</div>`;
            if (index === 0) rankBadge = `<div class="flex items-center justify-center w-12 h-10 rounded-full bg-yellow-100 text-yellow-600 font-black text-sm mx-auto shadow-md border border-yellow-300">🥇 1st</div>`;
            if (index === 1) rankBadge = `<div class="flex items-center justify-center w-12 h-9 rounded-full bg-slate-100 text-slate-500 font-black text-sm mx-auto shadow-md border border-slate-300">🥈 2nd</div>`;
            if (index === 2) rankBadge = `<div class="flex items-center justify-center w-12 h-9 rounded-full bg-orange-100 text-orange-700 font-black text-sm mx-auto shadow-md border border-orange-300">🥉 3rd</div>`;
            avgHTML += `<tr class="theme-table-row" data-id="${c.name.replace(/\s+/g, '')}"><td class="p-4 align-middle text-center">${rankBadge}</td><td class="p-5 font-black uppercase-tracking text-sm align-middle">${c.name}</td>`;
            window.criteria.forEach(crit => { let val = c[crit.id] || 0; let isMax = (val > 0 && val === maxScores[crit.id]); let highlightClass = isMax ? 'text-emerald-600 font-black bg-emerald-50 rounded-lg px-2 py-1 border border-emerald-200 shadow-sm' : 'font-bold'; avgHTML += `<td class="p-4 text-center align-middle"><span id="avg-${c.name.replace(/\s+/g, '')}-${crit.id}" class="score-number text-sm ${highlightClass}" data-current="${val}">${val.toFixed(2)}</span></td>`; });
            avgHTML += `<td class="p-5 font-black theme-text text-xl text-right align-middle"><span id="total-${c.name.replace(/\s+/g, '')}" class="score-number" data-current="${c.total}">${c.total.toFixed(2)}</span></td></tr>`;
          }); avgTable.innerHTML = avgHTML;
        } else {
          if (avgFlipper) avgFlipper.play();
          aggregated.forEach((c, index) => { const row = avgTable.querySelector(`tr[data-id="${c.name.replace(/\s+/g, '')}"]`); if(row) { let rankCell = row.querySelector('td:first-child'); let rankBadge = `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-black/5 theme-text-muted font-bold text-xs mx-auto">${index + 1}</div>`; if (index === 0) rankBadge = `<div class="flex items-center justify-center w-12 h-10 rounded-full bg-yellow-100 text-yellow-600 font-black text-sm mx-auto shadow-md border border-yellow-300">🥇 1st</div>`; if (index === 1) rankBadge = `<div class="flex items-center justify-center w-12 h-9 rounded-full bg-slate-100 text-slate-500 font-black text-sm mx-auto shadow-md border border-slate-300">🥈 2nd</div>`; if (index === 2) rankBadge = `<div class="flex items-center justify-center w-12 h-9 rounded-full bg-orange-100 text-orange-700 font-black text-sm mx-auto shadow-md border border-orange-300">🥉 3rd</div>`; rankCell.innerHTML = rankBadge; avgTable.appendChild(row); } });
          aggregated.forEach(c => { const candSlug = c.name.replace(/\s+/g, ''); window.criteria.forEach(crit => { const el = document.getElementById(`avg-${candSlug}-${crit.id}`); if(el) { window.animateCount(el, c[crit.id] || 0); let val = c[crit.id] || 0; let isMax = (val > 0 && val === maxScores[crit.id]); el.className = isMax ? 'score-number text-sm text-emerald-600 font-black bg-emerald-50 rounded-lg px-2 py-1 border border-emerald-200 shadow-sm transition-all' : 'score-number text-sm font-bold transition-all'; } }); const totalEl = document.getElementById(`total-${candSlug}`); if(totalEl) window.animateCount(totalEl, c.total); });
        }
      }
    };

    window.renderAdminDashboard = function() {
      if (document.getElementById('admin-setting-title')) { document.getElementById('admin-setting-title').value = window.settings['app_title'] || ''; document.getElementById('admin-setting-subtitle').value = window.settings['app_subtitle'] || ''; document.getElementById('admin-setting-location').value = window.settings['location_text'] || ''; document.getElementById('admin-setting-theme').value = window.settings['theme_color'] || 'red'; document.getElementById('admin-setting-voting').checked = String(window.settings['public_voting']).toLowerCase() === 'true'; document.getElementById('admin-setting-deadline').value = window.settings['voting_deadline'] || ''; }
      if (document.getElementById('admin-candidates-list')) { document.getElementById('admin-candidates-list').innerHTML = window.candidates.map(c => `<div class="flex justify-between items-center p-2 bg-slate-50 rounded border"><span><b>${c.id}</b>: ${c.name}</span><button onclick="window.deleteDocEntry('Candidates', '${c.id}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>`).join(''); document.getElementById('admin-criteria-list').innerHTML = window.criteria.map(c => `<div class="flex justify-between items-center p-2 bg-slate-50 rounded border"><span>${c.label} (${c.max}pt)</span><button onclick="window.deleteDocEntry('Criteria', '${c.id}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>`).join(''); document.getElementById('admin-users-list').innerHTML = window.users.map(u => `<div class="flex justify-between items-center p-2 bg-slate-50 rounded border"><span class="truncate pr-2">${u.username} (${u.role})</span><button onclick="window.deleteDocEntry('Users', '${u.id}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>`).join(''); }
    };

    window.saveSettings = async function() { try { const btn = document.querySelector('#view-admin .theme-btn'); btn.innerText = "Deploying..."; btn.disabled = true; const updates = { 'app_title': document.getElementById('admin-setting-title').value, 'app_subtitle': document.getElementById('admin-setting-subtitle').value, 'location_text': document.getElementById('admin-setting-location').value, 'theme_color': document.getElementById('admin-setting-theme').value, 'public_voting': document.getElementById('admin-setting-voting').checked, 'voting_deadline': document.getElementById('admin-setting-deadline').value }; for (const [key, value] of Object.entries(updates)) { await setDoc(doc(db, "Settings", key), { value: value }); } window.alert("Configuration successfully deployed to all devices."); btn.innerText = "Deploy Configuration"; btn.disabled = false; } catch (err) { window.alert("Error deploying: " + err.message); } };
    window.addCandidate = async function() { const id = document.getElementById('new-cand-id').value; const name = document.getElementById('new-cand-name').value; if(!id || !name) return window.alert("ID and Name are required."); await setDoc(doc(db, "Candidates", id), { id: parseInt(id), name: name, img: "" }); window.alert("Candidate added. Refresh to view changes."); };
    window.addCriteria = async function() { const id = document.getElementById('new-crit-id').value; const label = document.getElementById('new-crit-label').value; const max = document.getElementById('new-crit-max').value; if(!id || !label || !max) return window.alert("All fields are required."); await setDoc(doc(db, "Criteria", id), { id: id, label: label, short: id.substring(0,4), max: max }); window.alert("Criteria added. Refresh to view changes."); };
    window.addUser = async function() { const user = document.getElementById('new-user-username').value; const pass = document.getElementById('new-user-pass').value; const role = document.getElementById('new-user-role').value; if(!user || !pass) return window.alert("Username and Password are required."); const hashedPass = await window.sha256(pass); await setDoc(doc(db, "Users", user), { username: user, name: user, password: hashedPass, role: role }); window.alert("User added. Refresh to view changes."); };
    window.deleteDocEntry = async function(collectionName, docId) { if(confirm(`Are you sure you want to delete ${docId} from ${collectionName}?`)) { await deleteDoc(doc(db, collectionName, docId)); window.alert(`Deleted. Refresh page to update view.`); } };

    window.applyTheme = function(themeName) { const palettes = { red: { baseBg: '#fcfcfc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#111827', textMuted: '#6b7280', primary: '#e11d48', grad: 'linear-gradient(135deg, #f43f5e, #be123c)', shadow: 'rgba(225, 29, 72, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(244, 63, 94, 0.15)', mesh2: 'rgba(225, 29, 72, 0.12)', mesh3: 'rgba(253, 164, 175, 0.18)' }, blue: { baseBg: '#f8fafc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#0f172a', textMuted: '#64748b', primary: '#2563eb', grad: 'linear-gradient(135deg, #60a5fa, #1d4ed8)', shadow: 'rgba(37, 99, 235, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(96, 165, 250, 0.15)', mesh2: 'rgba(59, 130, 246, 0.12)', mesh3: 'rgba(191, 219, 254, 0.18)' } }; const t = palettes[themeName] || palettes['red']; const r = document.documentElement; for (const [key, value] of Object.entries(t)) { r.style.setProperty(`--t-${key.replace(/[A-Z]/g, m => "-" + m.toLowerCase())}`, value); } window.generatePremiumParticles(themeName); };
    window.generatePremiumParticles = function(themeName) { const container = document.getElementById('premium-particles'); if(!container) return; container.innerHTML = ''; const config = { shape: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z', count: 15, dir: 'down' }; for(let i = 0; i < config.count; i++) { const p = document.createElement('div'); p.className = 'premium-svg-particle'; p.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="${config.shape}"></path></svg>`; const size = Math.random() * 20 + 15; const left = Math.random() * 100; const duration = Math.random() * 15 + 15; const delay = Math.random() * -20; p.style.width = `${size}px`; p.style.height = `${size}px`; p.style.left = `${left}vw`; p.style.animationName = config.dir === 'up' ? 'premium-rise' : 'premium-fall'; p.style.animationDuration = `${duration}s`; p.style.animationDelay = `${delay}s`; container.appendChild(p); window.animateParticle(p); } };
  </script>
</body>
