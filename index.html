<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Portal v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* --- MODERN SILICON VALLEY MESH AURORA --- */
    .mesh-bg {
      position: fixed;
      inset: -20%;
      z-index: -1;
      background-color: var(--t-base-bg);
      background-image: 
        radial-gradient(circle at 15% 30%, var(--t-mesh-1), transparent 50%),
        radial-gradient(circle at 85% 20%, var(--t-mesh-2), transparent 50%),
        radial-gradient(circle at 50% 80%, var(--t-mesh-3), transparent 60%);
      background-size: 100% 100%;
      filter: blur(80px);
      animation: aurora-breathe 20s ease-in-out infinite alternate;
      will-change: transform;
      pointer-events: none;
    }
    
    @keyframes aurora-breathe {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(3%, 4%) scale(1.05) rotate(2deg); }
      100% { transform: translate(-3%, -2%) scale(0.95) rotate(-2deg); }
    }

    .card-panel { 
      background-color: var(--t-surface); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--t-border); 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05); 
      border-radius: 1.5rem; 
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
    }

    @keyframes premium-fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    @keyframes premium-rise {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
    .premium-svg-particle {
      position: absolute;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
      fill: var(--t-primary);
      filter: drop-shadow(0 10px 15px var(--t-shadow));
    }

    .theme-table-header { background-color: rgba(128, 128, 128, 0.06); border-bottom: 1px solid rgba(128, 128, 128, 0.15); }
    .theme-table-row { border-bottom: 1px solid rgba(128, 128, 128, 0.08); transition: background-color 0.2s ease; }
    .theme-table-row:hover { background-color: rgba(128, 128, 128, 0.04); }
    .theme-table-row:last-child { border-bottom: none; }

    :root {
      --t-base-bg: #fcfcfc;
      --t-surface: rgba(255, 255, 255, 0.92);
      --t-text-main: #111827;
      --t-text-muted: #6b7280;
      --t-primary: #e11d48;
      --t-grad: linear-gradient(135deg, #f43f5e, #be123c);
      --t-shadow: rgba(225, 29, 72, 0.15);
      --t-border: rgba(255, 255, 255, 0.6);
      --t-mesh-1: rgba(244, 63, 94, 0.15);
      --t-mesh-2: rgba(225, 29, 72, 0.12);
      --t-mesh-3: rgba(253, 164, 175, 0.18);
    }
    body { background-color: var(--t-base-bg); color: var(--t-text-main); transition: background-color 0.4s ease, color 0.4s ease; overflow-x: hidden; }
    
    .theme-text { color: var(--t-primary); }
    .theme-text-muted { color: var(--t-text-muted); }
    .theme-bg-soft { background-color: var(--t-base-bg); }
    .theme-surface { 
      background-color: var(--t-surface); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px);
    }
    
    .card-panel { background-color: var(--t-surface); border: 1px solid var(--t-border); box-shadow: 0 10px 30px var(--t-shadow); border-radius: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    
    @keyframes gradient-pan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .animate-gradient { background-image: var(--t-grad); background-size: 300% 300%; animation: gradient-pan 8s ease infinite; box-shadow: 0 10px 30px var(--t-shadow); }
    
    @keyframes float-3d { 0% { transform: rotateX(4deg) rotateY(-4deg) translateY(0px); } 50% { transform: rotateX(-2deg) rotateY(2deg) translateY(-8px); } 100% { transform: rotateX(4deg) rotateY(-4deg) translateY(0px); } }
    .header-3d-container { perspective: 1000px; transform-style: preserve-3d; }
    .header-3d-content { animation: float-3d 6s ease-in-out infinite; transform-style: preserve-3d; }
    .header-3d-pop { transform: translateZ(50px); }
    
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .animate-entry { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    
    @keyframes slide-in-right { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-right { animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

    .theme-header { 
      background-color: var(--t-surface); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--t-border); 
      box-shadow: 0 4px 20px var(--t-shadow); 
    }
    .theme-btn { background: var(--t-grad); color: #ffffff; box-shadow: 0 4px 15px var(--t-shadow); border: none; }
    .theme-btn:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 8px 25px var(--t-shadow); }
    .theme-input { background-color: var(--t-base-bg); border: 1px solid var(--t-border); color: var(--t-text-main); transition: all 0.3s ease; }
    .theme-input:focus { border-color: var(--t-primary); outline: none; box-shadow: 0 0 0 4px var(--t-shadow); }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 32px; width: 32px; border-radius: 50%; background: var(--t-surface); cursor: pointer; margin-top: -12px; box-shadow: 0 4px 15px var(--t-shadow); border: 4px solid var(--t-primary); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: var(--t-base-bg); border-radius: 4px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--t-border); }
    
    .hide-scroll-bar::-webkit-scrollbar { display: none; }
    .hide-scroll-bar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 4.2rem; height: 3.8rem; border-radius: 1.2rem; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .nav-btn.hidden { display: none !important; }

    .carousel-container { perspective: 1200px; transform-style: preserve-3d; display: flex; justify-content: center; align-items: center; height: 34rem; position: relative; width: 100%; overflow: hidden; }
    .carousel-item { position: absolute; width: 75%; max-width: 340px; height: 30rem; border-radius: 2rem; overflow: hidden; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s, z-index 0.6s; cursor: pointer; box-shadow: 0 15px 35px var(--t-shadow); }
    .item-active { transform: translateX(0) scale(1) translateZ(60px); z-index: 30; opacity: 1; pointer-events: auto; cursor: default; }
    .item-prev { transform: translateX(-65%) scale(0.8) translateZ(-100px) rotateY(25deg); z-index: 20; opacity: 0.5; }
    .item-next { transform: translateX(65%) scale(0.8) translateZ(-100px) rotateY(-25deg); z-index: 20; opacity: 0.5; }
    .item-hidden { opacity: 0; pointer-events: none; transform: scale(0.6) translateZ(-300px); z-index: 10; }

    .glass-panel { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }

    @keyframes lock-burst {  
      0% { transform: scale(1); }  
      40% { transform: scale(1.03); box-shadow: 0 0 0 6px var(--t-shadow); }  
      100% { transform: scale(1); box-shadow: none; }
    }
    .score-locked-flash { animation: lock-burst 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    
    .stagger-card { opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .stagger-card.animate-entry { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div class="mesh-bg"></div>
  <div id="premium-particles" class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden"></div>

  <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
      <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center">
          <svg class="animate-spin h-10 w-10 text-emerald-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span id="loader-text" class="text-sm font-black text-slate-800 tracking-widest uppercase">Connecting...</span>
      </div>
  </div>

  <div id="app-container" class="p-8">
    <h1 class="text-3xl font-black mb-4" id="display-title">System Connecting...</h1>
    <p id="status-text" class="text-slate-400">Initializing database...</p>
    
    </div>

  <script type="module">
    // ==========================================
    // 1. FIREBASE INITIALIZATION & IMPORTS
    // ==========================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, query, where, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVTCaxujL7Q0UmBqr-d5ev3CAZB5t3oxQ",
      authDomain: "dynamic-event-system.firebaseapp.com",
      projectId: "dynamic-event-system",
      storageBucket: "dynamic-event-system.firebasestorage.app",
      messagingSenderId: "588923118511",
      appId: "1:588923118511:web:1dba0b6be0c253d8bec55a",
      measurementId: "G-WMGGYLRE7P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;

    // ==========================================
    // 2. GLOBAL STATE VARIABLES
    // ==========================================
    window.settings = {}; window.criteria = []; window.candidates = []; window.users = []; 
    window.scoresData = {}; window.lockedScores = {}; window.currentSegment = ''; 
    window.activeUser = { name: "", role: "" };
    window.editState = { candidate: null, criteria: null, user: null };
    window.currentCarouselIndex = 0; window.carouselInterval = null; window.votingTimerInterval = null;
    window.activeConfirmCallback = null;
    
    let offlineQueue = JSON.parse(localStorage.getItem('pageant_offline_queue')) || [];

    // ==========================================
    // 3. CORE BOOTUP 
    // ==========================================
    window.onload = async function() {
      try {
        const savedName = localStorage.getItem('msval27_name');
        const savedRole = localStorage.getItem('msval27_role');
        if (savedRole === "undefined" || !savedRole) localStorage.clear();

        const [settingsSnap, criteriaSnap, candSnap, usersSnap] = await Promise.all([
          getDocs(collection(db, "Settings")),
          getDocs(collection(db, "Criteria")),
          getDocs(collection(db, "Candidates")),
          getDocs(collection(db, "Users"))
        ]);

        settingsSnap.forEach(doc => { window.settings[doc.id] = doc.data().value; });
        criteriaSnap.forEach(doc => { window.criteria.push({ id: doc.id, ...doc.data() }); });
        candSnap.forEach(doc => { window.candidates.push({ id: doc.id, ...doc.data() }); });
        usersSnap.forEach(doc => { window.users.push({ id: doc.id, ...doc.data() }); });

        if(document.getElementById('display-title')) document.getElementById('display-title').innerText = window.settings['app_title'] || "Event System";
        if(document.getElementById('display-subtitle')) document.getElementById('display-subtitle').innerText = window.settings['app_subtitle'] || "Core Operations";
        if(document.getElementById('display-location')) document.getElementById('display-location').innerText = window.settings['location_text'] || "Location Undefined";
        if(document.getElementById('display-icon')) document.getElementById('display-icon').innerText = window.settings['event_icon'] || "";
        if(document.getElementById('status-text')) document.getElementById('status-text').classList.add('hidden');
        
        window.applyTheme(window.settings['theme_color'] || 'red');
        document.title = (window.settings['app_title'] || "Event Portal") + " - Secure Access";

        if(window.criteria.length > 0) window.currentSegment = window.criteria[0].id;
        window.candidates.forEach(c => { 
          window.scoresData[c.id] = {}; 
          window.criteria.forEach(crit => { window.scoresData[c.id][crit.id] = parseFloat(crit.max) / 2 || 5; }); 
        });

        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden');
        
        window.renderHomeGallery(); window.renderTabs(); window.renderCandidates();

        if (savedName && savedRole && savedRole !== "undefined") {
          window.activeUser = { name: savedName, role: savedRole };
          window.updateNavForRole();
          const r = savedRole.toLowerCase().trim();
          if (r === 'tabulator') window.switchView('scores');
          else if (r === 'super user' || r === 'admin') window.switchView('admin');
          else { window.switchView('judging'); window.syncJudgeScores(); } 
        } else {
          window.switchView('home');
        }

      } catch(err) { 
        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden'); 
        alert("System Boot Error: " + err.message); 
      }
    };

    // ==========================================
    // 4. FIREBASE DATA OPERATIONS
    // ==========================================
    window.processLogin = async function() {
      const user = document.getElementById('login-username').value.trim(); 
      const pass = document.getElementById('login-password').value; 
      const btn = document.getElementById('login-btn'); 
      const err = document.getElementById('login-error');
      
      if (!user || !pass) { err.innerText = "Credentials required."; err.classList.remove('hidden'); return; }
      btn.innerText = "Authenticating..."; btn.disabled = true; err.classList.add('hidden');
      
      const hashedPass = await window.sha256(pass); 

      try {
        const q = query(collection(db, "Users"), where("username", "==", user));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) throw new Error("Invalid username.");
        
        let validUser = null;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data.password === hashedPass || data.password === pass) validUser = data;
        });

        if (!validUser) throw new Error("Invalid password.");

        window.activeUser = { name: validUser.name, role: validUser.role }; 
        localStorage.setItem('msval27_name', window.activeUser.name); 
        localStorage.setItem('msval27_role', window.activeUser.role); 
        window.updateNavForRole();
        
        const r = window.activeUser.role.toLowerCase().trim(); 
        if (r === 'tabulator') window.switchView('scores'); 
        else if (r === 'admin' || r === 'super user') window.switchView('admin'); 
        else { window.switchView('judging'); window.syncJudgeScores(); }
        
      } catch (error) {
        err.innerText = error.message; err.classList.remove('hidden');
      } finally {
        btn.innerText = "Authenticate"; btn.disabled = false;
      }
    };

    window.syncJudgeScores = async function() {
      if (!window.activeUser.name || (window.activeUser.role !== 'Judge' && window.activeUser.role !== 'Admin')) return;
      document.getElementById('loader-text').innerText = "Verifying Score Status...";
      document.getElementById('loader').classList.remove('hidden');

      try {
        const q = query(collection(db, "Scores"), where("judge", "==", window.activeUser.name));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const cand = window.candidates.find(c => c.name === data.candidate);
          if (cand) {
            window.lockedScores[cand.id] = window.lockedScores[cand.id] || {};
            window.criteria.forEach(crit => {
              if (data[crit.id] !== undefined) {
                window.scoresData[cand.id][crit.id] = data[crit.id];
                window.lockedScores[cand.id][crit.id] = true; 
              }
            });
          }
        });
        document.getElementById('loader').classList.add('hidden');
        if(document.getElementById('view-judging') && !document.getElementById('view-judging').classList.contains('hidden')) window.renderCandidates();
      } catch (error) {
        document.getElementById('loader').classList.add('hidden');
        console.error("Sync Error:", error);
      }
    };

    window.submitScore = async function(candidateId) {
      const c = window.candidates.find(can => String(can.id) === String(candidateId)); 
      if (!c) return alert("System Error: Candidate mismatch.");
      
      const score = window.scoresData[candidateId][window.currentSegment] || parseFloat(document.getElementById(`slider-${candidateId}`).value); 
      const btn = document.getElementById(`btn-${candidateId}`); 
      const cardPanel = btn.closest('.card-panel'); 
      
      btn.innerText = "Transmitting..."; btn.disabled = true;

      const payload = { judge: window.activeUser.name, candidate: c.name, [window.currentSegment]: score, timestamp: Date.now() };

      if (!navigator.onLine) {
        offlineQueue.push(payload);
        localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue));
        finalizeSubmitUI();
        window.showModal("Offline Mode", "Score saved locally. It will sync when connection returns.", "alert");
        return;
      }

      try {
        const docRef = doc(db, "Scores", `${window.activeUser.name}_${c.name}`);
        await setDoc(docRef, payload, { merge: true });
        finalizeSubmitUI();
      } catch (error) {
        offlineQueue.push(payload); localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue));
        finalizeSubmitUI(); window.showModal("Connection Issue", "Score saved locally. " + error.message, "alert");
      }

      function finalizeSubmitUI() {
          window.lockedScores[candidateId] = window.lockedScores[candidateId] || {}; 
          window.lockedScores[candidateId][window.currentSegment] = true; 
          cardPanel.classList.add('score-locked-flash'); 
          setTimeout(() => window.renderCandidates(), 500); 
      }
    };

    window.addEventListener('online', async () => {
      if (offlineQueue.length === 0) return;
      while(offlineQueue.length > 0) {
        const item = offlineQueue[0];
        try {
          const docRef = doc(db, "Scores", `${item.judge}_${item.candidate}`);
          await setDoc(docRef, item, { merge: true });
          offlineQueue.shift(); 
          localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue));
        } catch(e) { break; } 
      }
    });

    window.checkVoteAndRedirect = async function() {
      let voterId = localStorage.getItem('msval27_voter_id');
      if (!voterId) { voterId = window.generateUUID(); localStorage.setItem('msval27_voter_id', voterId); window.switchView('voting'); return; }
      
      const btn = document.getElementById('btn-cast-vote');
      if(btn) { btn.innerHTML = `Verifying Device...`; btn.disabled = true; }

      try {
        const docRef = doc(db, "PublicVotes", voterId);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) window.showModal("Already Voted", "A vote has already been cast from this device.", "alert");
        else window.switchView('voting');
      } catch (error) { window.showModal("Connection Error", "Could not verify device. " + error.message, "danger");
      } finally { if(btn) { btn.innerHTML = `Cast Your Vote Now`; btn.disabled = false; } }
    };

    window.submitPublicVote = async function(candidateId, candidateName) {
      let voterId = localStorage.getItem('msval27_voter_id'); 
      if (!voterId) { voterId = window.generateUUID(); localStorage.setItem('msval27_voter_id', voterId); }
      window.showModal("Processing Vote", `Registering your vote for ${candidateName}...`, "alert");
      
      try {
        const docRef = doc(db, "PublicVotes", voterId);
        const docSnap = await getDoc(docRef);
        if(docSnap.exists()) { window.showModal("Vote Rejected", "You have already voted.", "danger"); return; }
        await setDoc(docRef, { candidateId: candidateId, candidateName: candidateName, timestamp: Date.now() });
        window.showModal("Vote Confirmed", `Thank you! Your vote for <b>${candidateName}</b> has been recorded.`, "alert", function() { window.switchView('home'); });
      } catch (error) { window.showModal("Connection Error", "Failed to connect. " + error.message, "danger"); }
    };

    window.fetchScoresData = async function() { 
      document.getElementById('loader-text').innerText = "Processing Matrix..."; 
      document.getElementById('loader').classList.remove('hidden'); 
      try {
        const [scoresSnap, votesSnap] = await Promise.all([ getDocs(collection(db, "Scores")), getDocs(collection(db, "PublicVotes")) ]);
        const rawScores = scoresSnap.docs.map(d => d.data());
        let rawVotes = {};
        votesSnap.forEach(doc => { const cName = doc.data().candidateName; rawVotes[cName] = (rawVotes[cName] || 0) + 1; });
        document.getElementById('loader').classList.add('hidden');
        window.processAndRenderScores(rawScores, rawVotes);
      } catch (error) { document.getElementById('loader').classList.add('hidden'); alert("Scores Error: " + error.message); }
    };

    window.softReload = async function(view = 'admin') {
      document.getElementById('loader-text').innerText = "Syncing Database..."; 
      document.getElementById('loader').classList.remove('hidden');
      try {
        window.settings = {}; window.criteria = []; window.candidates = []; window.users = [];
        const [settingsSnap, criteriaSnap, candSnap, usersSnap] = await Promise.all([
          getDocs(collection(db, "Settings")), getDocs(collection(db, "Criteria")), getDocs(collection(db, "Candidates")), getDocs(collection(db, "Users"))
        ]);
        settingsSnap.forEach(doc => { window.settings[doc.id] = doc.data().value; });
        criteriaSnap.forEach(doc => { window.criteria.push({ id: doc.id, ...doc.data() }); });
        candSnap.forEach(doc => { window.candidates.push({ id: doc.id, ...doc.data() }); });
        usersSnap.forEach(doc => { window.users.push({ id: doc.id, ...doc.data() }); });
        document.getElementById('loader').classList.add('hidden'); 
        window.renderHomeGallery(); window.renderTabs(); window.renderCandidates(); 
        if (view === 'admin') window.renderAdminDashboard();
      } catch(e) { document.getElementById('loader').classList.add('hidden'); alert("Sync Error: " + e.message); }
    };

    window.saveAdminSettingsUI = async function() {
      const btn = document.getElementById('btn-save-settings'); btn.innerText = "Deploying..."; btn.disabled = true;
      const payload = { 
        app_title: document.getElementById('admin-setting-title').value, app_subtitle: document.getElementById('admin-setting-subtitle').value, 
        location_text: document.getElementById('admin-setting-location').value, event_icon: document.getElementById('admin-setting-icon').value, 
        theme_color: document.getElementById('admin-setting-theme').value, public_voting: document.getElementById('admin-setting-voting').checked ? 'true' : 'false', 
        voting_deadline: document.getElementById('admin-setting-deadline').value 
      };
      try {
        const batch = writeBatch(db);
        for (let key in payload) batch.set(doc(db, "Settings", key), { value: payload[key] });
        await batch.commit();

    window.setupVotingDeadline = function() {
      if (window.votingTimerInterval) clearInterval(window.votingTimerInterval);
      let deadlineStr = window.settings['voting_deadline']; 
      const voteBtn = document.getElementById('btn-cast-vote');
      const countdownContainer = document.getElementById('vote-countdown'); 
      const countdownTimer = document.getElementById('countdown-timer'); 
      const closedMsg = document.getElementById('vote-closed-msg');
      if(!voteBtn || !countdownContainer) return;

      if (!deadlineStr) { voteBtn.classList.remove('hidden'); countdownContainer.classList.add('hidden'); closedMsg.classList.add('hidden'); return; }
      if (!deadlineStr.includes('+') && !deadlineStr.includes('Z')) { deadlineStr += '+08:00'; }

      const deadline = new Date(deadlineStr).getTime();
      window.votingTimerInterval = setInterval(() => {
        const distance = deadline - new Date().getTime();
        if (distance <= 0) {
            clearInterval(window.votingTimerInterval); voteBtn.classList.add('hidden'); countdownContainer.classList.add('hidden'); closedMsg.classList.remove('hidden');
        } else {
            voteBtn.classList.remove('hidden'); closedMsg.classList.add('hidden'); countdownContainer.classList.remove('hidden');
            const days = Math.floor(distance / (1000 * 60 * 60 * 24)); 
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); 
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)); 
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            let timeText = ""; if(days > 0) timeText += `${days}d `;
            countdownTimer.innerText = timeText + `${hours.toString().padStart(2, '0')}h : ${minutes.toString().padStart(2, '0')}m : ${seconds.toString().padStart(2, '0')}s`;
        }
      }, 1000);
    }

    window.updateCarousel = function() {
      const items = document.querySelectorAll('.carousel-item'); if(items.length === 0) return;
      items.forEach((item, i) => {
        item.className = 'carousel-item';
        if (i === window.currentCarouselIndex) item.classList.add('item-active'); 
        else if (i === window.currentCarouselIndex - 1 || (window.currentCarouselIndex === 0 && i === items.length - 1)) item.classList.add('item-prev'); 
        else if (i === window.currentCarouselIndex + 1 || (window.currentCarouselIndex === items.length - 1 && i === 0)) item.classList.add('item-next'); 
        else item.classList.add('item-hidden');
      });
    }

    window.processAndRenderScores = function(rawScores, rawVotes) {
      const isVotingEnabled = window.settings['public_voting'] === true || String(window.settings['public_voting']).toLowerCase() === 'true';
      const pcCard = document.getElementById('peoples-choice-card');
      if (isVotingEnabled && pcCard) {
        pcCard.classList.remove('hidden'); 
        let votesArray = window.candidates.map(c => ({ name: c.name, votes: (rawVotes && rawVotes[c.name]) ? rawVotes[c.name] : 0 })).sort((a, b) => b.votes - a.votes);
        let pcHTML = `<tr class="theme-table-header text-[10px] uppercase tracking-widest"><th class="p-5 font-black text-center w-24 theme-text-muted">Rank</th><th class="p-5 font-black theme-text-muted">Identity</th><th class="p-5 font-black text-right w-32 theme-text-muted">Total Votes</th></tr>`;
        votesArray.forEach((c, index) => {
          const rankBadge = index === 0 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-amber-400 text-amber-900 font-black shadow-[0_0_15px_rgba(251,191,36,0.5)] text-xs mx-auto">1</div>` : index === 1 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-300 text-slate-800 font-black shadow-md text-xs mx-auto">2</div>` : index === 2 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-orange-700 text-orange-50 font-black shadow-md text-xs mx-auto">3</div>` : `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-black/5 theme-text-muted font-bold text-xs mx-auto">${index + 1}</div>`;
          pcHTML += `<tr class="theme-table-row"><td class="p-4 align-middle">${rankBadge}</td><td class="p-5 font-black text-inherit tracking-wide uppercase text-sm align-middle">${c.name}</td><td class="p-5 font-black theme-text text-xl text-right align-middle">${c.votes.toLocaleString()}</td></tr>`;
        });
        document.getElementById('table-peoples-choice').innerHTML = pcHTML;
      } else if (pcCard) pcCard.classList.add('hidden');

      const normalizedScores = (rawScores || []).map(s => { 
        let normalized = {}; 
        for (let key in s) { normalized[key.toLowerCase().replace(/\s+/g, '')] = s[key]; }
        normalized.judge = (s.judge || s.Judge || s.JUDGE || "").toString().trim(); 
        normalized.candidate = (s.candidate || s.Candidate || s.CANDIDATE || "").toString().trim(); 
        return normalized; 
      });
      
      let aggregated = window.candidates.map(c => { 
        let cleanCandidateName = c.name.toString().trim().toLowerCase();
        let sc = normalizedScores.filter(s => s.candidate.toLowerCase() === cleanCandidateName); 
        let count = sc.length; 
        let candData = { name: c.name, count: count, total: 0 }; 
        window.criteria.forEach(crit => { 
          let safeCritId = crit.id.toString().toLowerCase().replace(/\s+/g, '');
          let avg = count ? sc.reduce((sum, s) => sum + (parseFloat(s[safeCritId]) || parseFloat(s[crit.id]) || 0), 0) / count : 0; 
          candData[crit.id] = avg; candData.total += avg; 
        }); 
        return candData; 
      });
      
      aggregated.sort((a, b) => b.total - a.total); 
      const maxScores = {}; 
      window.criteria.forEach(crit => { maxScores[crit.id] = Math.max(...aggregated.map(c => c[crit.id] || 0)); });

      const avgTable = document.getElementById('table-averages'); 
      if (avgTable) {
        let avgHTML = `<tr class="theme-table-header text-[10px] uppercase tracking-widest"><th class="p-5 font-black text-center w-24 theme-text-muted">Rank</th><th class="p-5 font-black theme-text-muted">Identity</th>`;
        window.criteria.forEach(crit => { avgHTML += `<th class="p-5 font-black theme-text-muted text-center">${crit.short} <span class="font-mono text-[9px] opacity-70">(${crit.max})</span></th>`; }); 
        avgHTML += `<th class="p-5 font-black theme-text text-right">Aggregated</th></tr>`;
        aggregated.forEach((c, index) => {
          const rankBadge = index === 0 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-amber-400 text-amber-900 font-black shadow-[0_0_15px_rgba(251,191,36,0.5)] text-xs mx-auto">1</div>` : index === 1 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-300 text-slate-800 font-black shadow-md text-xs mx-auto">2</div>` : index === 2 ? `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-orange-700 text-orange-50 font-black shadow-md text-xs mx-auto">3</div>` : `<div class="flex items-center justify-center w-8 h-8 rounded-full bg-black/5 theme-text-muted font-bold text-xs mx-auto">${index + 1}</div>`;
          avgHTML += `<tr class="theme-table-row"><td class="p-4 align-middle">${rankBadge}</td><td class="p-5 font-black text-inherit tracking-wide uppercase text-sm align-middle">${c.name}</td>`;
          window.criteria.forEach(crit => { 
            let isMax = c[crit.id] === maxScores[crit.id] && c[crit.id] > 0; 
            let cellContent = isMax ? `<span class="inline-block px-3 py-1.5 rounded-lg theme-table-header theme-text font-black border border-[var(--t-primary)] shadow-sm text-sm">${c[crit.id].toFixed(2)}</span>` : `<span class="text-inherit opacity-80 font-bold text-sm">${c[crit.id].toFixed(2)}</span>`; 
            avgHTML += `<td class="p-4 text-center align-middle">${cellContent}</td>`; 
          });
          avgHTML += `<td class="p-5 font-black theme-text text-xl text-right align-middle">${c.total.toFixed(2)}</td></tr>`;
        }); 
        avgTable.innerHTML = avgHTML;
      }

      const detailTable = document.getElementById('table-detailed'); 
      if (detailTable) {
        let detailHTML = `<tr class="theme-table-header text-[10px] uppercase tracking-widest"><th class="p-5 font-black theme-text-muted">Assessor</th><th class="p-5 font-black theme-text-muted">Identity</th>`;
        window.criteria.forEach(crit => { detailHTML += `<th class="p-5 font-black theme-text-muted text-center">${crit.short}</th>`; }); 
        detailHTML += `<th class="p-5 font-black theme-text text-right">Summation</th></tr>`;
        normalizedScores.forEach((s) => {
          detailHTML += `<tr class="theme-table-row"><td class="p-5 font-black text-inherit uppercase text-xs align-middle opacity-70">${s.judge}</td><td class="p-5 text-inherit font-bold tracking-wide text-xs align-middle">${s.candidate}</td>`;
          let rowSum = 0; 
          window.criteria.forEach(crit => { 
            let safeCritId = crit.id.toString().toLowerCase().replace(/\s+/g, '');
            let score = parseFloat(s[safeCritId]) || parseFloat(s[crit.id]) || 0; 
            rowSum += score; 
            let styleClass = score === 0 ? "!text-red-500 font-black drop-shadow-md !opacity-100" : "text-inherit font-medium opacity-80";
            detailHTML += `<td class="p-4 ${styleClass} text-center align-middle">${score}</td>`; 
          }); 
          detailHTML += `<td class="p-5 font-black theme-text text-right text-sm align-middle">${rowSum}</td></tr>`;
        }); 
        detailTable.innerHTML = detailHTML;
      }
    }

    window.renderTabs = function() { const t = document.getElementById('segment-tabs'); if(t) t.innerHTML = window.criteria.map(crit => `<button onclick="switchSegment('${crit.id}')" class="flex-shrink-0 px-6 py-3 m-1 font-black text-[10px] uppercase tracking-widest rounded-2xl transition-all border ${window.currentSegment === crit.id ? 'theme-bg-soft theme-text border-black/10 shadow-sm' : 'bg-transparent theme-text-muted border-transparent hover:theme-bg-soft hover:border-black/5'}">${crit.short}</button>`).join(''); }
    window.switchSegment = function(id) { window.currentSegment = id; window.renderTabs(); window.renderCandidates(); }

    window.renderCandidates = function() {
      const activeCriteria = window.criteria.find(c => c.id === window.currentSegment); if(!activeCriteria) return;
      const cCont = document.getElementById('candidates-container'); if(!cCont) return;
      cCont.innerHTML = window.candidates.map(c => {
        const isLocked = window.lockedScores[c.id] && window.lockedScores[c.id][window.currentSegment]; 
        const displayScore = isLocked ? window.scoresData[c.id][window.currentSegment] : (window.scoresData[c.id][window.currentSegment] || activeCriteria.max/2); 
        const btnClass = isLocked ? 'bg-black/10 text-slate-500 cursor-not-allowed border border-black/5' : 'theme-btn active:scale-95';
        return `<div class="card-panel mb-10 overflow-hidden border-none shadow-2xl rounded-[2rem] bg-[var(--t-surface)]"><div class="relative w-full h-[28rem]"><img src="${c.img}" class="absolute inset-0 w-full h-full object-cover object-top"><div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent opacity-90"></div><div class="absolute bottom-4 inset-x-4 z-10"><div class="glass-panel p-5 rounded-[1.5rem] text-center"><p class="text-[10px] font-black uppercase tracking-[0.3em] mb-1 text-white/70">Candidate #${(c.id).toString().padStart(2, '0')}</p><h2 class="text-3xl font-black tracking-tight leading-none text-white drop-shadow-md">${c.name}</h2></div></div></div><div class="p-6 relative z-20 theme-surface rounded-b-[2rem]"><div class="flex justify-between items-center mb-8 theme-bg-soft p-5 rounded-2xl border border-black/5 shadow-inner"><div class="flex flex-col"><span class="text-[9px] theme-text font-black uppercase tracking-widest mb-1.5">Evaluation Parameter</span><label class="font-black text-sm tracking-wide uppercase leading-tight">${activeCriteria.label}</label></div><div class="theme-surface px-5 py-3 rounded-xl border border-black/10 min-w-[80px] text-center shadow-sm"><span class="font-black theme-text text-2xl tracking-tighter" id="score-val-${c.id}">${displayScore.toFixed(1)}</span></div></div><div class="px-2 mb-8 relative"><input type="range" id="slider-${c.id}" min="1" max="${activeCriteria.max}" step="0.5" value="${displayScore}" oninput="document.getElementById('score-val-${c.id}').innerText=parseFloat(this.value).toFixed(1); window.scoresData['${c.id}']['${window.currentSegment}']=parseFloat(this.value);" class="w-full relative z-10" ${isLocked ? 'disabled' : ''}></div><button onclick="submitScore('${c.id}')" id="btn-${c.id}" class="w-full py-4 rounded-xl font-black transition-all tracking-widest uppercase text-xs shadow-md ${btnClass} ${isLocked ? 'disabled' : ''}">${isLocked ? 'Score Locked' : 'Submit Evaluation'}</button></div></div>`;
      }).join('');
      
      const observer = new IntersectionObserver((entries) => {  
        entries.forEach((entry, i) => {    
          if (entry.isIntersecting) {      
            setTimeout(() => entry.target.classList.add('animate-entry'), i * 120);      
            observer.unobserve(entry.target);    
          }  
        });
      }, { threshold: 0.1 });
      
      document.querySelectorAll('.card-panel').forEach(el => { el.classList.add('stagger-card'); observer.observe(el); });
    }

    window.applyTheme = function(themeName) {
      const palettes = {
        red: { baseBg: '#fcfcfc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#111827', textMuted: '#6b7280', primary: '#e11d48', grad: 'linear-gradient(135deg, #f43f5e, #be123c)', shadow: 'rgba(225, 29, 72, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(244, 63, 94, 0.15)', mesh2: 'rgba(225, 29, 72, 0.12)', mesh3: 'rgba(253, 164, 175, 0.18)' },
        pink: { baseBg: '#fcfcfc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#111827', textMuted: '#6b7280', primary: '#db2777', grad: 'linear-gradient(135deg, #f472b6, #be185d)', shadow: 'rgba(219, 39, 119, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(244, 114, 182, 0.15)', mesh2: 'rgba(219, 39, 119, 0.12)', mesh3: 'rgba(252, 211, 227, 0.18)' },
        blue: { baseBg: '#f8fafc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#0f172a', textMuted: '#64748b', primary: '#2563eb', grad: 'linear-gradient(135deg, #60a5fa, #1d4ed8)', shadow: 'rgba(37, 99, 235, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(96, 165, 250, 0.15)', mesh2: 'rgba(59, 130, 246, 0.12)', mesh3: 'rgba(191, 219, 254, 0.18)' },
        green: { baseBg: '#f8fafc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#0f172a', textMuted: '#64748b', primary: '#16a34a', grad: 'linear-gradient(135deg, #4ade80, #15803d)', shadow: 'rgba(22, 163, 74, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(74, 222, 128, 0.12)', mesh2: 'rgba(22, 163, 74, 0.1)', mesh3: 'rgba(187, 247, 208, 0.15)' },
        gold: { baseBg: '#fefce8', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#422006', textMuted: '#b45309', primary: '#d97706', grad: 'linear-gradient(135deg, #fbbf24, #92400e)', shadow: 'rgba(217, 119, 6, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(251, 191, 36, 0.15)', mesh2: 'rgba(217, 119, 6, 0.12)', mesh3: 'rgba(253, 230, 138, 0.18)' },
        champagne: { baseBg: '#fafaf9', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#1c1917', textMuted: '#57534e', primary: '#78716c', grad: 'linear-gradient(135deg, #a8a29e, #44403c)', shadow: 'rgba(87, 83, 78, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(168, 162, 158, 0.15)', mesh2: 'rgba(120, 113, 108, 0.12)', mesh3: 'rgba(231, 229, 228, 0.18)' },
        indigo: { baseBg: '#0f172a', surface: 'rgba(30, 41, 59, 0.92)', textMain: '#f8fafc', textMuted: '#94a3b8', primary: '#818cf8', grad: 'linear-gradient(135deg, #818cf8, #4f46e5)', shadow: 'rgba(0, 0, 0, 0.4)', border: 'rgba(255, 255, 255, 0.08)', mesh1: 'rgba(99, 102, 241, 0.15)', mesh2: 'rgba(129, 140, 248, 0.12)', mesh3: 'rgba(79, 70, 229, 0.15)' },
        velvet: { baseBg: '#022c22', surface: 'rgba(6, 78, 59, 0.92)', textMain: '#f8fafc', textMuted: '#6ee7b7', primary: '#10b981', grad: 'linear-gradient(135deg, #34d399, #065f46)', shadow: 'rgba(0, 0, 0, 0.4)', border: 'rgba(255, 255, 255, 0.08)', mesh1: 'rgba(16, 185, 129, 0.15)', mesh2: 'rgba(52, 211, 153, 0.12)', mesh3: 'rgba(4, 120, 87, 0.15)' }
      };
      const t = palettes[themeName] || palettes['red']; 
      const r = document.documentElement;
      r.style.setProperty('--t-base-bg', t.baseBg); r.style.setProperty('--t-surface', t.surface); r.style.setProperty('--t-text-main', t.textMain); r.style.setProperty('--t-text-muted', t.textMuted); r.style.setProperty('--t-primary', t.primary); r.style.setProperty('--t-grad', t.grad); r.style.setProperty('--t-shadow', t.shadow); r.style.setProperty('--t-border', t.border); r.style.setProperty('--t-mesh-1', t.mesh1); r.style.setProperty('--t-mesh-2', t.mesh2); r.style.setProperty('--t-mesh-3', t.mesh3);
      window.generatePremiumParticles(themeName);
    }

    window.generatePremiumParticles = function(themeName) {
      const premiumShapes = { petal: 'M12 2C12 2 5 10 5 16C5 19.86 8.14 23 12 23C15.86 23 19 19.86 19 16C19 10 12 2 12 2Z', heart: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z', bubble: 'M12 2A10 10 0 1 1 2 12A10 10 0 0 1 12 2ZM12 4A8 8 0 1 0 20 12A8 8 0 0 0 12 4ZM8.5 7.5A1.5 1.5 0 1 1 7 9A1.5 1.5 0 0 1 8.5 7.5Z', leaf: 'M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66l.95-2.3c3.47.5 7.64-1.12 9.5-3.8 1.18-1.7 1.84-3.7 1.84-5.9z', sparkle: 'M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z', diamond: 'M12 2L2 11L12 22L22 11L12 2Z', moon: 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z', gem: 'M12 2L4 6v12l8 4 8-4V6l-8-4zm0 2.2l5.5 2.7v8.2L12 17.8 6.5 15.1V6.9L12 4.2z' };
      const themeVectors = { red: { shape: premiumShapes.petal, count: 15, dir: 'down' }, pink: { shape: premiumShapes.heart, count: 16, dir: 'down' }, blue: { shape: premiumShapes.bubble, count: 20, dir: 'up' }, green: { shape: premiumShapes.leaf, count: 14, dir: 'down' }, gold: { shape: premiumShapes.sparkle, count: 18, dir: 'down' }, champagne: { shape: premiumShapes.diamond, count: 14, dir: 'up' }, indigo: { shape: premiumShapes.moon, count: 12, dir: 'down' }, velvet: { shape: premiumShapes.gem, count: 14, dir: 'down' } };
      const container = document.getElementById('premium-particles'); if(!container) return; container.innerHTML = ''; 
      const config = themeVectors[themeName] || themeVectors['red'];
      for(let i = 0; i < config.count; i++) {
        const p = document.createElement('div'); p.className = 'premium-svg-particle'; p.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="${config.shape}"></path></svg>`;
        const size = Math.random() * 20 + 15; const left = Math.random() * 100; const duration = Math.random() * 15 + 15; const delay = Math.random() * -20;
        p.style.width = `${size}px`; p.style.height = `${size}px`; p.style.left = `${left}vw`; p.style.animationName = config.dir === 'up' ? 'premium-rise' : 'premium-fall'; p.style.animationDuration = `${duration}s`; p.style.animationDelay = `${delay}s`;
        container.appendChild(p); window.animateParticle(p);
      }
    }

    window.handleLogout = function() { window.showModal("Terminate Session", "Securely log out?", "confirm", () => { localStorage.clear(); window.activeUser = { name: "", role: "" }; document.getElementById('login-username').value = ""; document.getElementById('login-password').value = ""; ['nav-judging', 'nav-scores', 'nav-admin'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('hidden'); }); const navL = document.getElementById('nav-login'); if(navL) navL.classList.remove('hidden'); window.switchView('home'); }); }

  </script>
</body>
