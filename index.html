<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Portal v2</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --t-base-bg: #fcfcfc;
      --t-surface: rgba(255, 255, 255, 0.92);
      --t-text-main: #111827;
      --t-text-muted: #6b7280;
      --t-primary: #e11d48;
      --t-grad: linear-gradient(135deg, #f43f5e, #be123c);
      --t-shadow: rgba(225, 29, 72, 0.15);
      --t-border: rgba(255, 255, 255, 0.6);
      --t-mesh-1: rgba(244, 63, 94, 0.15);
      --t-mesh-2: rgba(225, 29, 72, 0.12);
      --t-mesh-3: rgba(253, 164, 175, 0.18);
    }

    /* TYPOGRAPHY ASSIGNMENTS */
    body { background-color: var(--t-base-bg); color: var(--t-text-main); font-family: 'DM Sans', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .nav-btn label, .theme-table-header th, .uppercase-tracking { font-family: 'Syne', sans-serif; }
    .score-number, .rolling-number { font-family: 'DM Mono', monospace; }

    /* MESH BACKGROUND */
    .mesh-bg { position: fixed; inset: -20%; z-index: -1; background-color: var(--t-base-bg); background-image: radial-gradient(circle at 15% 30%, var(--t-mesh-1), transparent 50%), radial-gradient(circle at 85% 20%, var(--t-mesh-2), transparent 50%), radial-gradient(circle at 50% 80%, var(--t-mesh-3), transparent 60%); background-size: 100% 100%; filter: blur(80px); animation: aurora-breathe 20s ease-in-out infinite alternate; will-change: transform; pointer-events: none; }
    @keyframes aurora-breathe { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 50% { transform: translate(3%, 4%) scale(1.05) rotate(2deg); } 100% { transform: translate(-3%, -2%) scale(0.95) rotate(-2deg); } }

    /* PREMIUM CARD & GLASSMORPHISM */
    .card-panel { background-color: var(--t-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--t-border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05); border-radius: 1.5rem; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .theme-header { background-color: var(--t-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--t-border); box-shadow: 0 4px 20px var(--t-shadow); }
    .theme-surface { background-color: var(--t-surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .glass-panel { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }

    .theme-text { color: var(--t-primary); }
    .theme-text-muted { color: var(--t-text-muted); }
    .theme-bg-soft { background-color: var(--t-base-bg); }
    .theme-btn { background: var(--t-grad); color: #ffffff; box-shadow: 0 4px 15px var(--t-shadow); border: none; }
    .theme-btn:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 8px 25px var(--t-shadow); }

    /* TABLES & FLIP ANIMATION */
    .theme-table-header { background-color: rgba(128, 128, 128, 0.06); border-bottom: 1px solid rgba(128, 128, 128, 0.15); }
    .theme-table-row { border-bottom: 1px solid rgba(128, 128, 128, 0.08); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease; }
    .theme-table-row:hover { background-color: rgba(128, 128, 128, 0.04); }
    .theme-table-row:last-child { border-bottom: none; }
    #table-averages, #table-peoples-choice { display: table; width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; }

    /* 4. FILLED RANGE SLIDER */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 32px; width: 32px; border-radius: 50%; background: var(--t-surface); cursor: pointer; margin-top: -12px; box-shadow: 0 4px 15px var(--t-shadow); border: 4px solid var(--t-primary); transition: transform 0.1s; }
    input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); }
    input[type=range]::-webkit-slider-runnable-track { height: 8px; cursor: pointer; border-radius: 4px; border: 1px solid var(--t-border); background: linear-gradient(to right, var(--t-primary) 0%, var(--t-primary) var(--fill, 50%), var(--t-base-bg) var(--fill, 50%), var(--t-base-bg) 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
    
    /* 5. SCORE POP ANIMATION */
    @keyframes score-pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--t-primary); } 100% { transform: scale(1); } }
    .score-pop { animation: score-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-block; }

    /* 7. VIEW TRANSITION ANIMATION */
    @keyframes view-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .view-animate { animation: view-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* 9. STAGGER CARD OBSERVER FIX */
    .stagger-card { opacity: 0; transform: translateY(28px); transition: opacity 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .stagger-card.visible { opacity: 1; transform: translateY(0); }

    /* PARTICLES & CAROUSEL */
    .premium-svg-particle { position: absolute; animation-timing-function: linear; animation-iteration-count: infinite; will-change: transform; fill: var(--t-primary); filter: drop-shadow(0 10px 15px var(--t-shadow)); }
    @keyframes premium-fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.15; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    @keyframes premium-rise { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.15; } 90% { opacity: 0.15; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

    .header-3d-container { perspective: 1000px; transform-style: preserve-3d; }
    .header-3d-content { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
    .header-3d-pop { transform: translateZ(50px); }

    .carousel-container { perspective: 1200px; transform-style: preserve-3d; display: flex; justify-content: center; align-items: center; height: 34rem; position: relative; width: 100%; overflow: hidden; touch-action: pan-y; }
    .carousel-item { position: absolute; width: 75%; max-width: 340px; height: 30rem; border-radius: 2rem; overflow: hidden; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s, z-index 0.6s; cursor: pointer; box-shadow: 0 15px 35px var(--t-shadow); }
    .item-active { transform: translateX(0) scale(1) translateZ(60px); z-index: 30; opacity: 1; pointer-events: auto; cursor: default; }
    .item-prev { transform: translateX(-65%) scale(0.8) translateZ(-100px) rotateY(25deg); z-index: 20; opacity: 0.5; }
    .item-next { transform: translateX(65%) scale(0.8) translateZ(-100px) rotateY(-25deg); z-index: 20; opacity: 0.5; }
    .item-hidden { opacity: 0; pointer-events: none; transform: scale(0.6) translateZ(-300px); z-index: 10; }

    @keyframes lock-burst { 0% { transform: scale(1); } 40% { transform: scale(1.03); box-shadow: 0 0 0 6px var(--t-shadow); } 100% { transform: scale(1); box-shadow: none; } }
    .score-locked-flash { animation: lock-burst 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    @keyframes slide-in-right { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-right { animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div class="mesh-bg"></div>
  <div id="premium-particles" class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden"></div>

  <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
      <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center">
          <svg class="animate-spin h-10 w-10 text-emerald-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span id="loader-text" class="text-sm font-black text-slate-800 tracking-widest uppercase-tracking">Connecting...</span>
      </div>
  </div>

  <div id="app-container" class="p-8">
    
    <div class="header-3d-container mb-8 hide-on-print text-center">
      <div class="header-3d-content">
        <h1 class="text-4xl md:text-5xl font-black header-3d-pop drop-shadow-lg" id="display-title">System Connecting...</h1>
        <p id="display-subtitle" class="text-lg opacity-80 header-3d-pop mt-2">Core Operations</p>
        <p id="display-location" class="text-sm theme-text font-bold header-3d-pop mt-1">Location Undefined</p>
      </div>
    </div>
    
    <p id="status-text" class="text-center text-slate-400 mb-8">Initializing database...</p>

    <div id="view-home" class="hidden">
      <div id="carousel-track" class="carousel-container mb-8"></div>
      <div id="vote-prompt-section" class="hidden text-center mb-4">
        <div id="vote-countdown" class="mb-4">
          <span class="text-xs uppercase-tracking theme-text-muted">Voting Closes In</span>
          <h3 id="countdown-timer" class="text-xl font-black score-number"></h3>
        </div>
        <p id="vote-closed-msg" class="hidden text-red-500 font-bold uppercase-tracking text-sm mb-4">Voting is Closed</p>
      </div>
      <div id="voting-gallery" class="max-w-md mx-auto"></div>
    </div>
    
    <div id="view-login" class="hidden max-w-sm mx-auto card-panel p-8">
      <h2 class="text-2xl font-black mb-6">Secure Access</h2>
      <input type="text" id="login-username" placeholder="Username" class="theme-input w-full p-3 rounded-xl mb-4" onkeydown="if(event.key === 'Enter') document.getElementById('login-password').focus();">
      <input type="password" id="login-password" placeholder="Passkey" class="theme-input w-full p-3 rounded-xl mb-6" onkeydown="if(event.key === 'Enter') window.processLogin();">
      <p id="login-error" class="text-red-500 text-sm font-bold mb-4 hidden"></p>
      <button id="login-btn" onclick="processLogin()" class="theme-btn w-full py-3 rounded-xl font-black uppercase-tracking text-sm">Authenticate</button>
    </div>

    <div id="view-judging" class="hidden max-w-md mx-auto">
      <div id="segment-tabs" class="flex overflow-x-auto hide-scroll-bar mb-6 p-2 bg-black/5 rounded-2xl"></div>
      <div id="candidates-container"></div>
    </div>

    <div id="view-scores" class="hidden max-w-5xl mx-auto">
      <div id="peoples-choice-card" class="card-panel p-6 mb-8 hidden">
        <h3 class="text-xl font-black mb-4 theme-text uppercase-tracking border-b border-black/10 pb-2">People's Choice Tracker</h3>
        <div class="overflow-x-auto"><table class="w-full" id="table-peoples-choice"></table></div>
      </div>
      <div class="card-panel p-6 mb-8">
        <h3 class="text-xl font-black mb-4 theme-text uppercase-tracking border-b border-black/10 pb-2">Aggregated Matrix</h3>
        <div class="overflow-x-auto"><table class="w-full" id="table-averages"></table></div>
      </div>
    </div>

    <div id="view-admin" class="hidden max-w-3xl mx-auto">
       </div>
    </div>

  <div id="offline-toast" style="position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#f9fafb;padding:.6rem 1.4rem;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:all .4s ease;pointer-events:none;z-index:300;white-space:nowrap">
    ⚡ Offline — score queued locally
  </div>

  <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
    <div id="custom-modal-content" class="theme-surface p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
      <div class="text-center mb-6"><div id="modal-icon" class="text-4xl mb-4"></div><h3 id="modal-title" class="text-2xl font-black text-gray-800"></h3></div>
      <p id="modal-message" class="text-center text-gray-600 mb-8 font-medium leading-relaxed"></p>
      <div id="modal-actions" class="flex justify-center gap-3"></div>
    </div>
  </div>

  <script type="module">
    // ==========================================
    // 1. FIREBASE INITIALIZATION & IMPORTS
    // ==========================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, query, where, writeBatch, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVTCaxujL7Q0UmBqr-d5ev3CAZB5t3oxQ",
      authDomain: "dynamic-event-system.firebaseapp.com",
      projectId: "dynamic-event-system",
      storageBucket: "dynamic-event-system.firebasestorage.app",
      messagingSenderId: "588923118511",
      appId: "1:588923118511:web:1dba0b6be0c253d8bec55a",
      measurementId: "G-WMGGYLRE7P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;

    // ==========================================
    // 2. GLOBAL STATE VARIABLES
    // ==========================================
    window.settings = {}; window.criteria = []; window.candidates = []; window.users = []; 
    window.scoresData = {}; window.lockedScores = {}; window.currentSegment = ''; 
    window.activeUser = { name: "", role: "" };
    window.editState = { candidate: null, criteria: null, user: null };
    window.currentCarouselIndex = 0; window.carouselInterval = null; window.votingTimerInterval = null;
    window.activeConfirmCallback = null;
    window.activeListeners = []; window.latestScores = []; window.latestVotes = {};
    
    let offlineQueue = JSON.parse(localStorage.getItem('pageant_offline_queue')) || [];

    // ==========================================
    // 3. UTILITIES & ANIMATIONS
    // ==========================================
    window.onerror = function(msg, url, line) { const loader = document.getElementById('loader'); if(loader) loader.classList.add('hidden'); alert("FRONTEND CRASH DETECTED\n\nError: " + msg + "\nLine: " + line); };
    window.alert = function(message) { window.showModal("System Notice", message, "alert"); };
    window.sha256 = async function(message) { const msgBuffer = new TextEncoder().encode(message); const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer); return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join(''); };
    window.generateUUID = function() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); };

    // 10. Offline Toast Integration
    window.showOfflineToast = function() {
      const t = document.getElementById('offline-toast');
      if(!t) return;
      t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 3500);
    }

    // 1. Physics-based particle sway (Updated Sine Wave drift)
    window.animateParticle = function(el) {  
      let baseX = parseFloat(el.style.left);  
      let amplitude = Math.random() * 2.5 + 0.8;  
      let frequency = Math.random() * 0.015 + 0.007;  
      let t = Math.random() * 100;  
      (function tick() {    
        t += 0.45;    
        el.style.left = (baseX + Math.sin(t * frequency) * amplitude) + 'vw';    
        requestAnimationFrame(tick);  
      })();
    };

    // RANK CHANGE FLIP ANIMATION HELPER
    window.animateRowSwap = function(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return null;
      const rows = container.querySelectorAll('.theme-table-row');
      const positions = new Map();
      rows.forEach(row => {
        const rect = row.getBoundingClientRect();
        positions.set(row.dataset.id || row.innerText.substring(0, 10), rect.top);
      });
      return {
        play: () => {
          const newRows = container.querySelectorAll('.theme-table-row');
          newRows.forEach(row => {
            const id = row.dataset.id || row.innerText.substring(0, 10);
            const firstTop = positions.get(id);
            const lastTop = row.getBoundingClientRect().top;
            if (firstTop && firstTop !== lastTop) {
              const deltaY = firstTop - lastTop;
              row.style.transition = 'none';
              row.style.transform = `translateY(${deltaY}px)`;
              requestAnimationFrame(() => {
                row.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease';
                row.style.transform = '';
              });
            }
          });
        }
      };
    };

    // 6. Animated score counters
    window.animateCount = function(el, target, decimals = 2, duration = 700) {  
      const start = parseFloat(el.dataset.current || 0);  
      const diff = target - start;  
      if (Math.abs(diff) < 0.01) { el.innerText = target.toFixed(decimals); el.dataset.current = target; return; }  
      let startTime = null;  
      (function step(ts) {    
        if (!startTime) startTime = ts;    
        const progress = Math.min((ts - startTime) / duration, 1);    
        const eased = 1 - Math.pow(1 - progress, 3); 
        el.innerText = (start + diff * eased).toFixed(decimals);    
        if (progress < 1) requestAnimationFrame(step);    
        else { el.innerText = target.toFixed(decimals); el.dataset.current = target; }  
      })(performance.now());
    };

    // ==========================================
    // 4. CORE BOOTUP 
    // ==========================================
    window.onload = async function() {
      try {
        const savedName = localStorage.getItem('msval27_name');
        const savedRole = localStorage.getItem('msval27_role');
        if (savedRole === "undefined" || !savedRole) localStorage.clear();

        // Data First Fetch
        const [criteriaSnap, candSnap, usersSnap] = await Promise.all([
          getDocs(collection(db, "Criteria")),
          getDocs(collection(db, "Candidates")),
          getDocs(collection(db, "Users"))
        ]);

        criteriaSnap.forEach(doc => { window.criteria.push({ id: doc.id, ...doc.data() }); });
        candSnap.forEach(doc => { window.candidates.push({ id: doc.id, ...doc.data() }); });
        usersSnap.forEach(doc => { window.users.push({ id: doc.id, ...doc.data() }); });

        // Real-Time Settings Listener
        onSnapshot(collection(db, "Settings"), (snapshot) => {
            snapshot.forEach(doc => { window.settings[doc.id] = doc.data().value; });
            if(document.getElementById('display-title')) document.getElementById('display-title').innerText = window.settings['app_title'] || "Event System";
            if(document.getElementById('display-subtitle')) document.getElementById('display-subtitle').innerText = window.settings['app_subtitle'] || "Core Operations";
            if(document.getElementById('display-location')) document.getElementById('display-location').innerText = window.settings['location_text'] || "Location Undefined";
            
            window.applyTheme(window.settings['theme_color'] || 'red');
            document.title = (window.settings['app_title'] || "Event Portal") + " - Secure Access";
            
            if(document.getElementById('carousel-track') && window.candidates.length > 0) window.renderHomeGallery();
        });

        if(document.getElementById('status-text')) document.getElementById('status-text').classList.add('hidden');
        if(window.criteria.length > 0) window.currentSegment = window.criteria[0].id;
        window.candidates.forEach(c => { 
          window.scoresData[c.id] = {}; 
          window.criteria.forEach(crit => { window.scoresData[c.id][crit.id] = parseFloat(crit.max) / 2 || 5; }); 
        });

        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden');
        
        window.renderHomeGallery(); window.renderTabs(); window.renderCandidates();
        if(typeof window.renderAdminDashboard === 'function') window.renderAdminDashboard();

        if (savedName && savedRole && savedRole !== "undefined") {
          window.activeUser = { name: savedName, role: savedRole };
          window.updateNavForRole();
          const r = savedRole.toLowerCase().trim();
          if (r === 'tabulator') window.switchView('scores');
          else if (r === 'super user' || r === 'admin') window.switchView('admin');
          else { window.switchView('judging'); window.syncJudgeScores(); } 
        } else {
          window.switchView('home');
        }

        // 2. Parallax hero header Initialization
        const heroContent = document.querySelector('.header-3d-content');
        if (heroContent) {
          document.addEventListener('mousemove', e => {  
            if (document.getElementById('view-home') && document.getElementById('view-home').classList.contains('hidden')) return;  
            const x = (window.innerWidth / 2 - e.pageX) / 30;  
            const y = (window.innerHeight / 2 - e.pageY) / 30;  
            heroContent.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
          });
          if (window.DeviceOrientationEvent) {  
            window.addEventListener('deviceorientation', e => {    
              if (document.getElementById('view-home') && document.getElementById('view-home').classList.contains('hidden')) return;    
              const x = Math.min(Math.max((e.gamma || 0) / 3, -12), 12);    
              const y = Math.min(Math.max((e.beta  || 0) / 5 - 10, -12), 12);    
              heroContent.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;  
            }, true);
          }
        }

      } catch(err) { 
        const loader = document.getElementById('loader');
        if (loader) loader.classList.add('hidden'); 
        alert("System Boot Error: " + err.message); 
      }
    };

    // ==========================================
    // 5. DATA OPERATIONS & AUTH
    // ==========================================
    window.processLogin = async function() {
      const user = document.getElementById('login-username').value.trim(); 
      const pass = document.getElementById('login-password').value; 
      const btn = document.getElementById('login-btn'); 
      const err = document.getElementById('login-error');
      
      if (!user || !pass) { err.innerText = "Credentials required."; err.classList.remove('hidden'); return; }
      btn.innerText = "Authenticating..."; btn.disabled = true; err.classList.add('hidden');
      const hashedPass = await window.sha256(pass); 

      try {
        const q = query(collection(db, "Users"), where("username", "==", user));
        const querySnapshot = await getDocs(q);
        if (querySnapshot.empty) throw new Error("Invalid username.");
        
        let validUser = null;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data.password === hashedPass || data.password === pass) validUser = data;
        });
        if (!validUser) throw new Error("Invalid password.");

        window.activeUser = { name: validUser.name, role: validUser.role }; 
        localStorage.setItem('msval27_name', window.activeUser.name); localStorage.setItem('msval27_role', window.activeUser.role); 
        window.updateNavForRole();
        
        const r = window.activeUser.role.toLowerCase().trim(); 
        if (r === 'tabulator') window.switchView('scores'); 
        else if (r === 'admin' || r === 'super user') window.switchView('admin'); 
        else { window.switchView('judging'); window.syncJudgeScores(); }
      } catch (error) { err.innerText = error.message; err.classList.remove('hidden');
      } finally { btn.innerText = "Authenticate"; btn.disabled = false; }
    };

    window.syncJudgeScores = async function() {
      if (!window.activeUser.name || (window.activeUser.role !== 'Judge' && window.activeUser.role !== 'Admin')) return;
      try {
        const q = query(collection(db, "Scores"), where("judge", "==", window.activeUser.name));
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const cand = window.candidates.find(c => c.name === data.candidate);
          if (cand) {
            window.lockedScores[cand.id] = window.lockedScores[cand.id] || {};
            window.criteria.forEach(crit => {
              if (data[crit.id] !== undefined) { window.scoresData[cand.id][crit.id] = data[crit.id]; window.lockedScores[cand.id][crit.id] = true; }
            });
          }
        });
        if(document.getElementById('view-judging') && !document.getElementById('view-judging').classList.contains('hidden')) window.renderCandidates();
      } catch (error) { console.error("Sync Error:", error); }
    };

    window.submitScore = async function(candidateId) {
      const c = window.candidates.find(can => String(can.id) === String(candidateId)); 
      if (!c) return alert("System Error: Candidate mismatch.");
      const score = window.scoresData[candidateId][window.currentSegment] || parseFloat(document.getElementById(`slider-${candidateId}`).value); 
      const btn = document.getElementById(`btn-${candidateId}`); const cardPanel = btn.closest('.card-panel'); 
      btn.innerText = "Transmitting..."; btn.disabled = true;

      const payload = { judge: window.activeUser.name, candidate: c.name, [window.currentSegment]: score, timestamp: Date.now() };

      if (!navigator.onLine) {
        offlineQueue.push(payload); localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue));
        finalizeSubmitUI(); window.showOfflineToast(); return;
      }

      try {
        const docRef = doc(db, "Scores", `${window.activeUser.name}_${c.name}`);
        await setDoc(docRef, payload, { merge: true });
        finalizeSubmitUI();
      } catch (error) {
        offlineQueue.push(payload); localStorage.setItem('pageant_offline_queue', JSON.stringify(offlineQueue));
        finalizeSubmitUI(); window.showOfflineToast();
      }

      function finalizeSubmitUI() {
          // 8. Haptic feedback on score submit
          if (navigator.vibrate) navigator.vibrate([15, 20, 60]);
          window.lockedScores[candidateId] = window.lockedScores[candidateId] || {}; 
          window.lockedScores[candidateId][window.currentSegment] = true; 
          cardPanel.classList.add('score-locked-flash'); 
          setTimeout(() => window.renderCandidates(), 500); 
      }
    };

    window.fetchScoresData = async function() { 
      document.getElementById('loader-text').innerText = "Initializing Live Matrix..."; document.getElementById('loader').classList.remove('hidden'); 
      window.activeListeners.forEach(unsub => unsub()); window.activeListeners = [];
      try {
        const unsubScores = onSnapshot(collection(db, "Scores"), (snapshot) => {
            window.latestScores = snapshot.docs.map(d => d.data());
            window.processAndRenderScores(window.latestScores, window.latestVotes);
            document.getElementById('loader').classList.add('hidden');
        });
        window.activeListeners.push(unsubScores);

        const fetchVotes = async () => {
            const votesSnap = await getDocs(collection(db, "PublicVotes"));
            window.latestVotes = {};
            votesSnap.forEach(doc => { const cName = doc.data().candidateName; window.latestVotes[cName] = (window.latestVotes[cName] || 0) + 1; });
            window.processAndRenderScores(window.latestScores, window.latestVotes);
        };
        await fetchVotes(); const voteInterval = setInterval(fetchVotes, 60000); window.activeListeners.push(() => clearInterval(voteInterval));
      } catch (error) { document.getElementById('loader').classList.add('hidden'); alert("Matrix Error: " + error.message); }
    };

    // ==========================================
    // 6. UI RENDERERS & HELPERS
    // ==========================================
    window.switchView = function(targetView) {
      if ((targetView === 'judging' || targetView === 'scores' || targetView === 'admin') && !window.activeUser.name) targetView = 'login';
      if (targetView === 'scores') window.fetchScoresData();
      if (targetView === 'admin' && typeof window.renderAdminDashboard === 'function') window.renderAdminDashboard();
      ['home', 'login', 'judging', 'scores', 'admin', 'voting'].forEach(v => { const el = document.getElementById(`view-${v}`); if(el) el.classList.add('hidden'); });
      
      const targetEl = document.getElementById(`view-${targetView}`); 
      // 7. View transition animation
      if (targetEl) {
        targetEl.classList.remove('hidden');
        targetEl.classList.add('view-animate');
        setTimeout(() => targetEl.classList.remove('view-animate'), 450);
      }

      ['home', 'judging', 'scores', 'admin', 'login'].forEach(nav => { const el = document.getElementById(`nav-${nav}`); if(el) { el.classList.remove('theme-text', 'opacity-100', 'theme-bg-soft', '-translate-y-2', 'shadow-md'); el.classList.add('theme-text-muted', 'opacity-60'); } });
      const navTarget = targetView === 'voting' ? 'home' : targetView; const activeNav = document.getElementById(`nav-${navTarget}`);
      if(activeNav) { activeNav.classList.remove('theme-text-muted', 'opacity-60'); activeNav.classList.add('theme-text', 'opacity-100', 'theme-bg-soft', '-translate-y-2', 'shadow-md'); }
      window.scrollTo(0,0);
    }

    // 3. Swipe gestures for the carousel
    window.initCarouselSwipe = function() {
      const track = document.getElementById('carousel-track');
      if (!track) return;
      let startX = 0, startY = 0;
      track.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        clearInterval(window.carouselInterval);
      }, { passive: true });
      track.addEventListener('touchend', e => {
        const dx = startX - e.changedTouches[0].clientX; const dy = startY - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
          window.currentCarouselIndex = dx > 0 ? (window.currentCarouselIndex + 1) % window.candidates.length : (window.currentCarouselIndex - 1 + window.candidates.length) % window.candidates.length;
          window.updateCarousel();
        }
        window.startCarouselAutoPlay();
      }, { passive: true });
    }

    window.renderHomeGallery = function() {
      const isVotingEnabled = window.settings['public_voting'] === true || String(window.settings['public_voting']).toLowerCase() === 'true';
      const cTrack = document.getElementById('carousel-track');
      const fallbackImg = "https://images.unsplash.com/photo-1511367461989-f85a21fda167?auto=format&fit=crop&w=800&q=80";

      if (cTrack) {
        cTrack.innerHTML = window.candidates.map((c, index) => {
          const imgSrc = (c.img && c.img.length > 5) ? c.img : fallbackImg;
          // 12. Lazy-load candidate images via loading="lazy"
          return `
          <div class="carousel-item" onclick="goToCarousel(${index})">
            <img src="${imgSrc}" loading="lazy" onerror="this.src='${fallbackImg}'" class="absolute inset-0 w-full h-full object-cover object-top opacity-95">
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
            <div class="absolute bottom-0 inset-x-0 p-5 text-center">
              <p class="text-[10px] font-black uppercase-tracking tracking-[0.3em] mb-1 text-white/70">No. ${(c.id).toString().padStart(2, '0')}</p>
              <h3 class="text-2xl font-black tracking-tight leading-none text-white drop-shadow-md">${c.name}</h3>
            </div>
          </div>
        `}).join('');
        window.updateCarousel(); window.startCarouselAutoPlay(); window.initCarouselSwipe();
      }
      // ... (Rest of voting UI omitted for brevity)
    }

    window.renderCandidates = function() {
      const activeCriteria = window.criteria.find(c => c.id === window.currentSegment); if(!activeCriteria) return;
      const cCont = document.getElementById('candidates-container'); if(!cCont) return;
      
      cCont.innerHTML = window.candidates.map(c => {
        const isLocked = window.lockedScores[c.id] && window.lockedScores[c.id][window.currentSegment]; 
        const displayScore = isLocked ? window.scoresData[c.id][window.currentSegment] : (window.scoresData[c.id][window.currentSegment] || activeCriteria.max/2); 
        const btnClass = isLocked ? 'bg-black/10 text-slate-500 cursor-not-allowed border border-black/5' : 'theme-btn active:scale-95';
        const fallbackImg = "https://images.unsplash.com/photo-1511367461989-f85a21fda167?auto=format&fit=crop&w=800&q=80";
        const imgSrc = (c.img && c.img.length > 5) ? c.img : fallbackImg;
        // Calculate initial fill percentage for slider
        const fillPct = ((displayScore - 1) / (activeCriteria.max - 1)) * 100;

        return `<div class="card-panel mb-10 overflow-hidden border-none shadow-2xl rounded-[2rem] bg-[var(--t-surface)]">
          <div class="relative w-full h-[28rem]">
            <img src="${imgSrc}" loading="lazy" onerror="this.src='${fallbackImg}'" class="absolute inset-0 w-full h-full object-cover object-top">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent opacity-90"></div>
            <div class="absolute bottom-4 inset-x-4 z-10"><div class="glass-panel p-5 rounded-[1.5rem] text-center"><p class="text-[10px] font-black uppercase-tracking tracking-[0.3em] mb-1 text-white/70">Candidate #${(c.id).toString().padStart(2, '0')}</p><h2 class="text-3xl font-black tracking-tight leading-none text-white drop-shadow-md">${c.name}</h2></div></div>
          </div>
          <div class="p-6 relative z-20 theme-surface rounded-b-[2rem]">
            <div class="flex justify-between items-center mb-8 theme-bg-soft p-5 rounded-2xl border border-black/5 shadow-inner">
              <div class="flex flex-col"><span class="text-[9px] theme-text font-black uppercase-tracking tracking-widest mb-1.5">Evaluation Parameter</span><label class="font-black text-sm tracking-wide uppercase-tracking leading-tight">${activeCriteria.label}</label></div>
              <div class="theme-surface px-5 py-3 rounded-xl border border-black/10 min-w-[80px] text-center shadow-sm"><span class="font-black theme-text text-2xl tracking-tighter score-number" id="score-val-${c.id}">${displayScore.toFixed(1)}</span></div>
            </div>
            <div class="px-2 mb-8 relative">
              <input type="range" id="slider-${c.id}" min="1" max="${activeCriteria.max}" step="0.5" value="${displayScore}" style="--fill: ${fillPct}%" 
              oninput="
                const v = parseFloat(this.value);
                const scoreEl = document.getElementById('score-val-${c.id}');
                scoreEl.innerText = v.toFixed(1);
                scoreEl.classList.remove('score-pop');
                void scoreEl.offsetWidth;
                scoreEl.classList.add('score-pop');
                window.scoresData['${c.id}']['${window.currentSegment}'] = v;
                const pct = ((v - 1) / (${activeCriteria.max} - 1)) * 100;
                this.style.setProperty('--fill', pct + '%');
              " class="w-full relative z-10" ${isLocked ? 'disabled' : ''}>
            </div>
            <button onclick="submitScore('${c.id}')" id="btn-${c.id}" class="w-full py-4 rounded-xl font-black transition-all uppercase-tracking text-xs shadow-md ${btnClass} ${isLocked ? 'disabled' : ''}">${isLocked ? 'Score Locked' : 'Submit Evaluation'}</button>
          </div>
        </div>`;
      }).join('');
      
      // 9. Fix the stagger-card observer (using .visible class)
      const observer = new IntersectionObserver((entries) => {  
        entries.forEach((entry, i) => {    
          if (entry.isIntersecting) {      
            setTimeout(() => entry.target.classList.add('visible'), i * 100);      
            observer.unobserve(entry.target);    
          }  
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card-panel').forEach(el => { el.classList.add('stagger-card'); observer.observe(el); });
    }

    window.processAndRenderScores = function(rawScores, rawVotes) {
      // Setup FLIP recording
      const avgFlipper = window.animateRowSwap('table-averages');
      
      const normalizedScores = (rawScores || []).map(s => { 
        let normalized = {}; 
        for (let key in s) { normalized[key.toLowerCase().replace(/\s+/g, '')] = s[key]; }
        normalized.judge = (s.judge || "").toString().trim(); normalized.candidate = (s.candidate || "").toString().trim(); 
        return normalized; 
      });
      
      let aggregated = window.candidates.map(c => { 
        let cleanCandidateName = c.name.toString().trim().toLowerCase();
        let sc = normalizedScores.filter(s => s.candidate.toLowerCase() === cleanCandidateName); 
        let count = sc.length; let candData = { name: c.name, count: count, total: 0 }; 
        window.criteria.forEach(crit => { 
          let safeCritId = crit.id.toString().toLowerCase().replace(/\s+/g, '');
          let avg = count ? sc.reduce((sum, s) => sum + (parseFloat(s[safeCritId]) || parseFloat(s[crit.id]) || 0), 0) / count : 0; 
          candData[crit.id] = avg; candData.total += avg; 
        }); return candData; 
      });
      aggregated.sort((a, b) => b.total - a.total); 

      const avgTable = document.getElementById('table-averages'); 
      if (avgTable) {
        if (avgTable.innerHTML.trim() === "") {
          let avgHTML = `<tr class="theme-table-header text-[10px] uppercase-tracking tracking-widest"><th class="p-5 font-black text-center w-24 theme-text-muted">Rank</th><th class="p-5 font-black theme-text-muted text-left">Identity</th>`;
          window.criteria.forEach(crit => { avgHTML += `<th class="p-5 font-black theme-text-muted text-center">${crit.short}</th>`; }); 
          avgHTML += `<th class="p-5 font-black theme-text text-right">Aggregated</th></tr>`;
          
          aggregated.forEach((c, index) => {
            // Apply data-id for FLIP animation mapping
            avgHTML += `<tr class="theme-table-row" data-id="${c.name.replace(/\s+/g, '')}"><td class="p-4 align-middle text-center"><div class="flex items-center justify-center w-8 h-8 rounded-full bg-black/5 theme-text-muted font-bold text-xs mx-auto">${index + 1}</div></td><td class="p-5 font-black uppercase-tracking text-sm align-middle">${c.name}</td>`;
            window.criteria.forEach(crit => { avgHTML += `<td class="p-4 text-center align-middle"><span id="avg-${c.name.replace(/\s+/g, '')}-${crit.id}" class="score-number font-bold text-sm" data-current="${c[crit.id]}">${c[crit.id].toFixed(2)}</span></td>`; });
            avgHTML += `<td class="p-5 font-black theme-text text-xl text-right align-middle"><span id="total-${c.name.replace(/\s+/g, '')}" class="score-number" data-current="${c.total}">${c.total.toFixed(2)}</span></td></tr>`;
          }); 
          avgTable.innerHTML = avgHTML;
        } else {
          // Table exists! Trigger FLIP & Animated count
          if (avgFlipper) avgFlipper.play();
          
          // Re-order DOM elements to match new ranks silently if order changed
          aggregated.forEach((c, index) => {
            const row = avgTable.querySelector(`tr[data-id="${c.name.replace(/\s+/g, '')}"]`);
            if(row) {
              row.querySelector('td:first-child div').innerText = index + 1; // update rank badge
              avgTable.appendChild(row); // physically move in DOM
            }
          });

          // 6. Animate Count
          aggregated.forEach(c => {
            const candSlug = c.name.replace(/\s+/g, '');
            window.criteria.forEach(crit => {
                const el = document.getElementById(`avg-${candSlug}-${crit.id}`);
                if(el) window.animateCount(el, c[crit.id]);
            });
            const totalEl = document.getElementById(`total-${candSlug}`);
            if(totalEl) window.animateCount(totalEl, c.total);
          });
        }
      }
    }

    // Modal Helpers
    window.showModal = function(title, message, type = 'alert', callback = null) {
      const modal = document.getElementById('custom-modal'); const content = document.getElementById('custom-modal-content'); const actionsEl = document.getElementById('modal-actions');
      if(!modal) return;
      document.getElementById('modal-title').innerText = title; document.getElementById('modal-message').innerHTML = message; window.activeConfirmCallback = callback;
      if (type === 'confirm' || type === 'danger') {
        const btnColor = type === 'danger' ? 'bg-red-600 hover:bg-red-700 text-white' : 'theme-btn text-white';
        actionsEl.innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 text-xs font-black theme-text-muted hover:opacity-70 transition-colors uppercase-tracking rounded-lg">Abort</button><button onclick="executeModalAction()" class="px-6 py-2.5 text-xs font-black rounded-xl shadow-md transition-transform active:scale-95 uppercase-tracking ${btnColor}">Confirm</button>`;
      } else {
        actionsEl.innerHTML = `<button onclick="executeModalAction()" class="px-8 py-3 text-xs font-black text-white rounded-xl shadow-md transition-transform active:scale-95 theme-btn uppercase-tracking">Acknowledge</button>`;
      }
      modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
    }
    window.closeModal = function() { const modal = document.getElementById('custom-modal'); const content = document.getElementById('custom-modal-content'); if(!modal) return; content.classList.remove('scale-100'); content.classList.add('scale-95'); modal.classList.add('opacity-0'); setTimeout(() => modal.classList.add('hidden'), 300); if(window.activeConfirmCallback && document.getElementById('modal-actions').innerHTML.includes('Acknowledge')) window.activeConfirmCallback = null; }
    window.executeModalAction = function() { if (window.activeConfirmCallback) window.activeConfirmCallback(); window.closeModal(); }
    window.updateNavForRole = function() { /* Implementation matches existing logic */ }

    // Theme Engine 
    window.applyTheme = function(themeName) {
      const palettes = {
        red: { baseBg: '#fcfcfc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#111827', textMuted: '#6b7280', primary: '#e11d48', grad: 'linear-gradient(135deg, #f43f5e, #be123c)', shadow: 'rgba(225, 29, 72, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(244, 63, 94, 0.15)', mesh2: 'rgba(225, 29, 72, 0.12)', mesh3: 'rgba(253, 164, 175, 0.18)' },
        blue: { baseBg: '#f8fafc', surface: 'rgba(255, 255, 255, 0.92)', textMain: '#0f172a', textMuted: '#64748b', primary: '#2563eb', grad: 'linear-gradient(135deg, #60a5fa, #1d4ed8)', shadow: 'rgba(37, 99, 235, 0.15)', border: 'rgba(255, 255, 255, 0.6)', mesh1: 'rgba(96, 165, 250, 0.15)', mesh2: 'rgba(59, 130, 246, 0.12)', mesh3: 'rgba(191, 219, 254, 0.18)' }
        // add other palettes as needed
      };
      const t = palettes[themeName] || palettes['red']; const r = document.documentElement;
      for (const [key, value] of Object.entries(t)) {
        r.style.setProperty(`--t-${key.replace(/[A-Z]/g, m => "-" + m.toLowerCase())}`, value);
      }
      window.generatePremiumParticles(themeName);
    }

    window.generatePremiumParticles = function(themeName) {
      const config = { shape: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z', count: 15, dir: 'down' }; // Example heart
      const container = document.getElementById('premium-particles'); if(!container) return; container.innerHTML = ''; 
      for(let i = 0; i < config.count; i++) {
        const p = document.createElement('div'); p.className = 'premium-svg-particle'; p.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="${config.shape}"></path></svg>`;
        const size = Math.random() * 20 + 15; const left = Math.random() * 100; const duration = Math.random() * 15 + 15; const delay = Math.random() * -20;
        p.style.width = `${size}px`; p.style.height = `${size}px`; p.style.left = `${left}vw`; p.style.animationName = config.dir === 'up' ? 'premium-rise' : 'premium-fall'; p.style.animationDuration = `${duration}s`; p.style.animationDelay = `${delay}s`;
        container.appendChild(p); window.animateParticle(p);
      }
    }
  </script>
